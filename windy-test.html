<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windy centring test</title>
<style>
  :root{ --bg:#EFECE2; --fg:#1D2C4E; --muted:#5C6672; --card:#fff; --line:#C9CFD8; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0A0F22; --fg:#E9E4D4; --muted:#8B93B8; --card:#111834; --line:#2A3358; } }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  h1{ font-size:18px; margin:0 0 4px; }
  p{ margin:0 0 12px; color:var(--muted); max-width:900px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); gap:14px; }
  .t{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .t h2{ font-size:14px; margin:0 0 2px; }
  .t code{ display:block; font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:8px; }
  .map{ position:relative; height:320px; border-radius:8px; overflow:hidden; background:#888; }
  .map iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .dot{ position:absolute; left:50%; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
        background:#e74c3c; box-shadow:0 0 0 2px #fff, 0 0 6px rgba(0,0,0,.6); pointer-events:none; z-index:1; }
</style>
</head>
<body>
<h1>Windy centring test</h1>
<p id="intro">Each map should be centred on the station, under the red dot. Note which ones aren't, and whether a Windy marker or a blue "your location" dot appears.</p>
<div class="grid" id="grid"></div>
<script>
(function(){
  var tests = [
    ['A: the link you confirmed', ''],
    ['B: A without play=true (the still map)', 'noplay'],
    ['C: A plus units (metricRain/Temp/Wind)', '&metricRain=mm&metricTemp=%C2%B0C&metricWind=mph'],
    ['D: A plus marker=true and detailLat/detailLon', 'marker']
  ];
  function build(lat, lon){
    document.getElementById('intro').textContent =
      'Station: ' + lat + ', ' + lon + '. Each map should be centred under the red dot. Note which ones aren’t, and whether a Windy marker or a blue “your location” dot appears and where.';
    var base = 'https://embed.windy.com/embed.html?type=map&location=coordinates&zoom=7&overlay=radar&level=surface&lat=' + lat + '&lon=' + lon + '&message=true';
    var grid = document.getElementById('grid');
    tests.forEach(function(t){
      var url = base + '&play=true';
      if (t[1] === 'noplay') url = base;
      else if (t[1] === 'marker') url = base + '&play=true&detailLat=' + lat + '&detailLon=' + lon + '&marker=true';
      else url += t[1];
      var box = document.createElement('div');
      box.className = 't';
      box.innerHTML = '<h2></h2><code></code><div class="map"><div class="dot"></div></div>';
      box.querySelector('h2').textContent = t[0];
      box.querySelector('code').textContent = url;
      var f = document.createElement('iframe');
      f.src = url;
      f.title = t[0];
      box.querySelector('.map').insertBefore(f, box.querySelector('.dot'));
      grid.appendChild(box);
    });
  }
  var qs = new URLSearchParams(location.search);
  if (qs.get('lat') && qs.get('lon')) return build(qs.get('lat'), qs.get('lon'));
  fetch('./jsondata/archive.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ build(parseFloat(d.meta.latitude).toFixed(3), parseFloat(d.meta.longitude).toFixed(3)); })
    .catch(function(){ build('51.937', '-0.982'); });
})();
</script>
</body>
</html>
