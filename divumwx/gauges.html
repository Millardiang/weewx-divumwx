<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DivumWX Weather</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="header.css?v=s3n2026k">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root,
[data-bs-theme="light"]{
  --bw-accent:#B45309;
  --bw-accent-soft:#3A2E1A;
  --bw-lime:#C9DA1E;
  --bw-sky:#6FB6DD;
  --bw-good:#5BBB8A;
  --live-good:#39E888;
  --bw-danger:#E36B57;
  --bw-yellow:#D6BE4E;
  --bw-radius:18px;
  --bw-radius-sm:10px;
  --bw-shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);

  --bs-body-bg: #EFECE2;
  --bs-body-color: #1D2C4E;
  --bs-secondary-color: #5C6672;
  --bs-tertiary-bg: #FFFFFF;
  --bs-secondary-bg: #FFFFFF;
  --bs-border-color: #C9CFD8;
  --bs-card-bg: #FFFFFF;
  --bs-font-sans-serif:'Lexend', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
[data-bs-theme="dark"]{
  --bw-accent:#D3A94C;
  --bw-accent-soft:#3A2E1A;
  --bw-sky:#6FB6DD;
  --bw-good:#5BBB8A;
  --live-good:#39E888;
  --bw-danger:#E36B57;
  --bw-yellow:#D6BE4E;
  --bw-shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);

  --bs-body-bg: #0A0F22;
  --bs-body-color: #E9E4D4;
  --bs-secondary-color: #8B93B8;
  --bs-tertiary-bg: #111834;
  --bs-secondary-bg: #111834;
  --bs-border-color: #2A3358;
  --bs-card-bg: #111834;
}

body{
  font-family:var(--bs-font-sans-serif);
  padding-bottom:48px;
  transition:background-color .25s ease, color .25s ease;
}
.font-mono{font-family:'Lexend', system-ui, sans-serif;}

body.season-winter { --bs-card-bg: #e9f2ec; }
[data-bs-theme="dark"] body.season-winter { --bs-card-bg: #24312a; }
body.season-spring { --bs-card-bg: #eef7e3; }
[data-bs-theme="dark"] body.season-spring { --bs-card-bg: #26301f; }
body.season-summer { --bs-card-bg: #fff6d9; }
[data-bs-theme="dark"] body.season-summer { --bs-card-bg: #332c16; }
body.season-autumn { --bs-card-bg: #f2e6d8; }
[data-bs-theme="dark"] body.season-autumn { --bs-card-bg: #2c2118; }

/* ---------- Title and live status ---------- */
.page-title{font-size:32px;font-weight:700;margin:0 0 4px;}
.live-status-wrap{position:relative;display:inline-flex;width:8px;height:8px;flex-shrink:0;}
#gaugesStatusDot{width:8px;height:8px;border-radius:50%;display:block;position:relative;z-index:1;}
.live-status-ripple{
  position:absolute;top:50%;left:50%;
  width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;
  background:radial-gradient(circle, var(--live-good) 0%, var(--live-good) 35%, transparent 75%);
  opacity:0;pointer-events:none;
  filter:blur(.3px);
}
.live-status-ripple.ping{ animation: dot-ripple 1.8s cubic-bezier(.25,.6,.4,1) 1; }
@keyframes dot-ripple{
  0%   { width:8px;   height:8px;   margin:-4px 0 0 -4px;   opacity:.8; }
  45%  { opacity:.45; }
  100% { width:110px; height:110px; margin:-55px 0 0 -55px; opacity:0; }
}
@media (prefers-reduced-motion: reduce){ .live-status-ripple.ping{ animation:none; } }

footer{font-size:12px;color:var(--bs-secondary-color);font-family:'Lexend', system-ui, sans-serif;}
</style>
</head>
<body>

<div class="container-xl">
  <div w3-include-html="navbar.html"></div>

  <div class="d-flex align-items-baseline justify-content-between flex-wrap gap-2 mt-1">
    <div>
      <h1 class="page-title" id="gaugesTitle">Live Gauges</h1>
    </div>
    <div class="font-mono small d-flex align-items-center gap-2" style="color:var(--bs-secondary-color);">
      <span class="live-status-wrap"><span id="gaugesStatusDot" title="Connecting…" style="background:var(--bs-secondary-color);"></span><span id="gaugesStatusRing" class="live-status-ripple"></span></span>
      <span id="gaugesStatusLabel">CONNECTING</span> · <span id="gaugesUpdatedLabel">UPDATED</span> <span id="gaugesClock">--:--:--</span>
    </div>
  </div>

  <div id="gaugesErr" class="alert alert-danger mt-3" style="display:none;"></div>

  <div class="cs-embed">
    <div class="cs-layout">
      <section class="gauges" id="gauges" aria-label="Live gauges"></section>

      <section class="panel" id="calendar-panel" aria-labelledby="cal-title" hidden>
        <div class="panel-head">
          <h2 id="cal-title">Year at a Glance</h2>
          <div class="seg" id="cal-metric" role="tablist" aria-label="Calendar measure"></div>
        </div>
        <div class="calendar-scroll"><div id="calendar"></div></div>
        <div class="cal-foot"><div id="cal-legend"></div><p id="cal-summary" class="muted"></p></div>
      </section>
    </div>

    <dialog id="detail" aria-labelledby="detail-title">
      <form method="dialog" class="detail-head">
        <h2 id="detail-title">History</h2>
        <button class="icon-btn" value="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </form>
      <div id="detail-chart"></div>
    </dialog>

    <div class="cs-tooltip" id="tooltip" role="tooltip" hidden></div>
  </div>

  <footer class="text-center py-3" id="gaugesFooter">DivumWX — Gauges</footer>
</div>

<script src="cardI18n.js?v=s3n2026a"></script>
<script src="siteHeader.js"></script>
<script src="stationTime.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="units.js"></script>
<script>
// ===================== Static text i18n =====================
(function applyStaticLabels(){
  DivumWXI18N.applyLabel(document.getElementById('gaugesTitle'), 'Live Gauges');
  DivumWXI18N.applyAttr(document.getElementById('gaugesStatusDot'), 'title', 'Connecting…');
  DivumWXI18N.applyLabel(document.getElementById('gaugesUpdatedLabel'), 'UPDATED');
  DivumWXI18N.applyLabel(document.getElementById('gaugesFooter'), 'DivumWX — Gauges');
  DivumWXI18N.applyLabel(document.getElementById('cal-title'), 'Year at a Glance');
})();
</script>
<script src="csGauges.js?v=1.0.0"></script>
<script>
// ===================== Live status (from csGauges.js) =====================
var lastGaugesStatus = 'connecting', lastGaugesTs = null;
function setGaugesStatus(status){
  lastGaugesStatus = status;
  var dot = document.getElementById('gaugesStatusDot');
  var label = document.getElementById('gaugesStatusLabel');
  if(status==='live'){ dot.style.background = 'var(--bw-good)'; label.textContent = DivumWXI18N.t('LIVE'); }
  else if(status==='stale'){ dot.style.background = 'var(--bw-accent)'; label.textContent = DivumWXI18N.t('LIVE (stale)'); }
  else if(status==='offline'){ dot.style.background = 'var(--bw-danger)'; label.textContent = DivumWXI18N.t('OFFLINE'); }
  else { dot.style.background = 'var(--bs-secondary-color)'; label.textContent = DivumWXI18N.t('CONNECTING'); }
  var errEl = document.getElementById('gaugesErr');
  if(status==='offline'){
    errEl.textContent = DivumWXI18N.t('Live data unavailable:') + ' loop.json';
    errEl.style.display = '';
  } else errEl.style.display = 'none';
}
function pulseStatusDot(){
  var ring = document.getElementById('gaugesStatusRing');
  if(!ring) return;
  ring.classList.remove('ping');
  void ring.offsetWidth;
  ring.classList.add('ping');
}
window.addEventListener('csgaugesstatus', function(e){
  var d = e.detail || {};
  if(d.state==='live' && d.dateTime && d.dateTime !== lastGaugesTs){
    lastGaugesTs = d.dateTime;
    document.getElementById('gaugesClock').textContent = new Date(d.dateTime * 1000).toLocaleTimeString('en-GB', {hour12:false, timeZone: (window.StationTime ? window.StationTime.getTZ() : undefined)});
    pulseStatusDot();
  }
  setGaugesStatus(d.state);
});
window.addEventListener('i18nready', function(){ setGaugesStatus(lastGaugesStatus); });

function setStationTitle(){
  fetch('./jsondata/archive.json?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      var loc = data && data.meta && data.meta.station_location;
      var el = document.querySelector('.brand-text');
      if(loc && el) el.textContent = loc;
    })
    .catch(function(e){ console.warn('gauges: station_location fetch failed —', e.message); });
}

// ===================== Theme (DivumWX dark / light / auto) =====================
// The gauges follow data-bs-theme on <html>: light -> chrome bezel and beige
// face, dark -> black-metal bezel and carbon fibre face.
var root = document.documentElement;
var themeMode = localStorage.getItem('dashboardThemeMode') || 'auto';
var lastIsDay = null;

var THEME_ICONS = { auto: '\u{1F313}', light: '☀️', dark: '\u{1F319}' };
var THEME_ORDER = ['dark', 'light', 'auto'];
if (!THEME_ORDER.includes(themeMode)) themeMode = 'dark';
function resolveAutoIsDay(){
  if(lastIsDay != null) return !!lastIsDay;
  return !window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function resolveTheme(){
  return themeMode==='light' ? 'light' : themeMode==='dark' ? 'dark' : (resolveAutoIsDay() ? 'light' : 'dark');
}
function applyTheme(){
  var t = resolveTheme();
  if(root.getAttribute('data-bs-theme') !== t) root.setAttribute('data-bs-theme', t);
  syncThemeNavUI();
}
function syncThemeNavUI(){
  var btn = document.getElementById('themeToggle');
  if(!btn) return;
  var resolved = resolveTheme();
  btn.textContent = THEME_ICONS[themeMode];
  btn.title = themeMode === 'auto' ? ('Auto (currently ' + resolved + ')') : (themeMode.charAt(0).toUpperCase() + themeMode.slice(1));
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
  if(themeMode==='auto') applyTheme();
});
// isDay from loop.json drives the auto theme
window.addEventListener('divumwxloop', function(e){
  var o = e.detail || {};
  if(o.isDay != null && o.isDay !== lastIsDay){ lastIsDay = o.isDay; if(themeMode==='auto') applyTheme(); }
});
window.addEventListener('storage', function(e){
  if(e.key === 'dashboardThemeMode'){
    themeMode = e.newValue || 'auto';
    if (!THEME_ORDER.includes(themeMode)) themeMode = 'dark';
    applyTheme();
  }
  if(e.key === 'dashboardUnitSystem'){
    var unitSelect = document.getElementById('unitSystem');
    if(unitSelect && e.newValue) unitSelect.value = e.newValue;
  }
});

applyTheme();

includeHTML(function(){
  initSharedHeader();   // fills the unit selector; its changes reach the gauges as 'unitsystemchange'
  setStationTitle();
  var themeBtn = document.getElementById('themeToggle');
  if(themeBtn){
    themeBtn.addEventListener('click', function(){
      themeMode = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
      localStorage.setItem('dashboardThemeMode', themeMode);
      applyTheme();
    });
  }
  syncThemeNavUI();
});
</script>
</body>
</html>
