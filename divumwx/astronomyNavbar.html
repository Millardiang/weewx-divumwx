<!-- All links here are root-relative (leading "/divumwx/") rather than
     plain relative paths -- this navbar is included from pages at two
     different directory depths (astronomy.html/constellations.html/
     meteorShowers.html at the DivumWX root, and skyfield/index.html/
     celestial/index.html one level down), and a plain relative href
     like "constellations.html" or "./skyfield" resolves against
     whichever page included it. From skyfield/index.html that turned
     "./celestial/index.html" into skyfield/celestial/index.html (a
     page that doesn't exist) -- root-relative paths resolve the same
     way regardless of which page included this file.

     The "/divumwx/" prefix itself is REQUIRED, not optional: DivumWX's
     own HTML_ROOT is a subdirectory of the site's web root
     (<site_root>/divumwx/...), not the web root itself -- a bare
     "/index.html" resolves to <site_root>/index.html, not
     <site_root>/divumwx/index.html, landing on whatever unrelated page
     (or nothing) the site happens to serve at its actual root. -->

        </svg>
