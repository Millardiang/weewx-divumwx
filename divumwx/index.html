<script>
// ==== THEME HANDLING ====
const STATION_LAT = 51.94;
const STATION_LON = -0.987;
const THEME_KEY = 'dashboardThemeMode';
const THEME_ICONS = { auto: '\u{1F313}', light: '\u2600\uFE0F', dark: '\u{1F319}' };
const THEME_ORDER = ['dark', 'light', 'auto'];

const SEASON_ICONS = { winter: '\u2744\uFE0F', spring: '\u{1F338}', summer: '\u{1F33B}', autumn: '\u{1F342}' };
const SEASON_CLASSES = ['season-winter', 'season-spring', 'season-summer', 'season-autumn'];
const NORTHERN_SEASON_BY_MONTH = [
  'winter', 'winter', 'spring', 'spring', 'spring', 'summer',
  'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter'
];
const SEASON_SWAP_SOUTH = { winter: 'summer', summer: 'winter', spring: 'autumn', autumn: 'spring' };
function getMeteorologicalSeason(date, lat) {
  const season = NORTHERN_SEASON_BY_MONTH[date.getMonth()];
  return (lat >= 0) ? season : SEASON_SWAP_SOUTH[season];
}
function seasonLabel(season) {
  if (season === 'autumn' && (localStorage.getItem('dashboardUnitSystem') || 'uk') === 'us') return 'Fall';
  return season.charAt(0).toUpperCase() + season.slice(1);
}

let lastIsDay = null;
const LOOP_JSON_URL_FOR_THEME = './jsondata/loop.json';
const THEME_ISDAY_POLL_MS = 60 * 1000;

function getSunTimes(date, lat, lon) {
  const rad = Math.PI / 180;
  const msPerDay = 86400000;
  const J1970 = 2440588, J2000 = 2451545;
  const toJulian = d => d.valueOf() / msPerDay - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * msPerDay);
  const toDays = d => toJulian(d) - J2000;

  const obliquity = rad * 23.4397;
  const meanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
  const eclipticLon = M => {
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const perihelion = rad * 102.9372;
    return M + C + perihelion + Math.PI;
  };
  const declination = L => Math.asin(Math.sin(L) * Math.sin(obliquity));
  const julianCycle = (d, lw) => Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const approxTransit = (Ht, lw, n) => 0.0009 + (Ht + lw) / (2 * Math.PI) + n;
  const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const hourAngle = (h, phi, dec) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));

  const lw = rad * -lon, phi = rad * lat;
  const d = toDays(date);
  const n = julianCycle(d, lw);
  const ds = approxTransit(0, lw, n);
  const M = meanAnomaly(ds);
  const L = eclipticLon(M);
  const dec = declination(L);
  const Jnoon = solarTransitJ(ds, M, L);

  const h0 = -0.833 * rad;
  const H = hourAngle(h0, phi, dec);
  if (isNaN(H)) return null;

  const Jset = solarTransitJ(approxTransit(H, lw, n), M, L);
  const Jrise = Jnoon - (Jset - Jnoon);
  return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset) };
}

function getThemeMode() {
  const stored = localStorage.getItem(THEME_KEY);
  return THEME_ORDER.includes(stored) ? stored : 'auto';
}

function effectiveTheme(mode) {
  if (mode === 'light' || mode === 'dark') return mode;
  if (mode === 'seasonal') return 'light';
  if (lastIsDay != null) return lastIsDay ? 'light' : 'dark';
  const now = new Date();
  const sun = getSunTimes(now, STATION_LAT, STATION_LON);
  if (!sun) return 'light';
  return (now >= sun.sunrise && now < sun.sunset) ? 'light' : 'dark';
}

let lastAppliedTheme = null;
function applyDashboardTheme() {
  const mode = getThemeMode();
  const resolved = effectiveTheme(mode);
  document.body.classList.remove('light', 'dark');
  document.body.classList.add(resolved);

  // Seasonal accent mode retired site-wide -- see header.js's
  // applySeasonClass() for the full rationale. This page has its own
  // independent inline implementation (doesn't call the shared
  // header.js function at all), so it needed the identical no-op
  // treatment applied directly here. currentSeason kept as a variable
  // (always null now) since it's still referenced below (themechange
  // event detail, theme-toggle button label) and those call sites
  // already handle null correctly -- every other themeMode already
  // exercises that same null path today.
  const currentSeason = null;

  if (resolved !== lastAppliedTheme) {
    lastAppliedTheme = resolved;
    window.dispatchEvent(new CustomEvent('themechange', { detail: { theme: resolved, season: currentSeason } }));
  }
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  if (mode === 'seasonal') {
    btn.textContent = SEASON_ICONS[currentSeason];
    btn.title = 'Seasonal (' + seasonLabel(currentSeason) + ')';
  } else {
    btn.textContent = THEME_ICONS[mode];
    btn.title = mode === 'auto' ? ('Auto (currently ' + resolved + ')') : mode.charAt(0).toUpperCase() + mode.slice(1);
  }
}

function pollIsDayForTheme() {
  fetch(LOOP_JSON_URL_FOR_THEME + ((LOOP_JSON_URL_FOR_THEME).indexOf('?')>-1?'&':'?') + '_=' + Date.now(), { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(j => {
      const o = (j && j.observations) || {};
      if (o.isDay != null) {
        lastIsDay = o.isDay;
        if (getThemeMode() === 'auto') applyDashboardTheme();
      }
    })
    .catch(e => console.warn('dashboard: loop.json poll (theme) failed —', e.message));
}

applyDashboardTheme();
pollIsDayForTheme();
setInterval(pollIsDayForTheme, THEME_ISDAY_POLL_MS);

setInterval(() => {
  const m = getThemeMode();
  if (m === 'auto' || m === 'seasonal') applyDashboardTheme();
}, 60 * 1000);
</script>

<script src="units.js"></script>

<script>
// ==== UNIT SYSTEM HANDLING ====
const UNIT_KEY = 'dashboardUnitSystem';
const UNIT_LABELS = {
  uk: 'UK (\u00B0C, mph, hPa)',
  us: 'US (\u00B0F, mph, inHg)',
  metric: 'Metric (\u00B0C, km/h, hPa)',
  scandi: 'Scandinavian (\u00B0C, m/s, hPa)',
  canada: 'Canada (\u00B0C, km/h, kPa)',
  aviation: 'Aviation (\u00B0C, kt, mbar)',
  beaufort: 'Beaufort (\u00B0C, Bft, hPa)'
};

function populateUnitSelector() {
  const select = document.getElementById('unitSystem');
  if (!select) return;
  if (typeof SYSTEMS === 'undefined') {
    console.warn('dashboard: units.js not loaded — unit selector disabled');
    select.disabled = true;
    return;
  }
  Object.keys(SYSTEMS).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = UNIT_LABELS[key] || key;
    select.appendChild(opt);
  });
  select.value = localStorage.getItem(UNIT_KEY) || 'uk';
  select.onchange = () => {
    localStorage.setItem(UNIT_KEY, select.value);
    broadcastUnitSystem();
    if (getThemeMode() === 'seasonal') applyDashboardTheme();
  };
}

function broadcastUnitSystem() {
  const select = document.getElementById('unitSystem');
  const system = select ? select.value : (localStorage.getItem(UNIT_KEY) || 'uk');
  window.dispatchEvent(new CustomEvent('unitsystemchange', {
    detail: { system: system, config: (typeof SYSTEMS !== 'undefined' ? SYSTEMS[system] : null) }
  }));
}

// ==== LANGUAGE HANDLING ====
// Unlike the unit selector above, there's no separate broadcast function
// here: DivumWXI18N.setLanguage() (cardI18n.js, part of
// cardsBundleNew.js) already does persistence + the equivalent broadcast
// internally, so the onchange handler below just calls straight through
// to it.
//
// Timing note: cardsBundleNew.js (which defines window.DivumWXI18N) is
// deliberately the LAST script tag on this page, loaded well after this
// block and after includeHTML()'s callback (which is where
// populateLanguageSelector() below actually gets called from) -- so
// DivumWXI18N will not exist yet at that point. Rather than delay/poll
// for it, this listens for cardI18n.js's own 'i18nready' event instead:
// window.addEventListener works even when registered before the event's
// eventual source (cardsBundleNew.js) has loaded, since it's just
// registering interest in a named event on `window`, not a reference to
// DivumWXI18N itself. 'i18nready' fires once after the initial
// translations load, AND again on every later language switch (from
// this page or, via the saved localStorage value, a previous visit) --
// populateLanguageSelector() below is written to be safe to call
// repeatedly: it only builds the <option> list once, but always
// resyncs select.value, so it stays correct either way.
// populateLanguageSelector() is written to be safe to call repeatedly:
// it only builds the <option> list once, but always resyncs select.value
// AND the flag image/label (both below), so it stays correct on every
// call regardless of whether this is the very first load or a later
// switch.
function populateLanguageSelector() {
  const select = document.getElementById('languageSystem');
  const flagImg = document.getElementById('languageFlag');
  const label = document.getElementById('languageLabel');
  if (!select || typeof DivumWXI18N === 'undefined') return;
  if (!select.options.length) {
    DivumWXI18N.getAvailableLanguages().forEach(code => {
      const opt = document.createElement('option');
      opt.value = code;
      // Emoji flag prefix -- a real <img> can't go inside a native
      // <option> in any browser, so this is what makes the OPEN dropdown
      // list itself show a flag per language; the closed state gets a
      // real SVG via #languageFlag below instead, since an <img> works
      // fine there.
      const emoji = DivumWXI18N.getLanguageFlagEmoji(code);
      opt.textContent = (emoji ? emoji + ' ' : '') + DivumWXI18N.getLanguageName(code);
      select.appendChild(opt);
    });
    select.onchange = () => {
      DivumWXI18N.setLanguage(select.value);
    };
  }
  const current = DivumWXI18N.getLanguage();
  select.value = current;
  if (flagImg) {
    const url = DivumWXI18N.getLanguageFlagUrl(current);
    if (url) { flagImg.src = url; flagImg.style.display = ''; }
    else { flagImg.style.display = 'none'; }
  }
  // Shows the current language's own name once one is actually known,
  // rather than #unitSystem's pattern of always showing a static
  // "Select units" caption -- once there's a flag next to it, a caption
  // that never changes reads as broken/wrong on repeat visits (it would
  // sit there showing "Select language" right beside e.g. the Danish
  // flag AND the language already switched to Danish, contradicting
  // itself), whereas a plain unit-system dropdown has no comparable
  // "current value" to show without duplicating what's already in the
  // option list's own units.
  if (label) label.textContent = DivumWXI18N.getLanguageName(current);
}
window.addEventListener('i18nready', populateLanguageSelector);

window.addEventListener('storage', e => {
  if (e.key === THEME_KEY) applyDashboardTheme();
});

// ==== MENU HANDLING ====

// ==== CHART MODAL ====
const chartModalOverlay = document.getElementById('chartModalOverlay');
const chartModalBox = document.getElementById('chartModalBox');
const chartModalTitle = document.getElementById('chartModalTitle');
const chartModalIframe = document.getElementById('chartModalIframe');
const chartModalClose = document.getElementById('chartModalClose');
let chartModalLastFocused = null;

function chartModalOpen(link) {
  const rawUrl = link.getAttribute('href');
  if (!rawUrl || rawUrl === '#') return;

  const url = rawUrl + (rawUrl.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now();

  chartModalLastFocused = document.activeElement;
  chartModalTitle.textContent = link.getAttribute('data-title') || link.getAttribute('data-modal') || '';

  const w = parseInt(link.getAttribute('data-modal-width'), 10);
  chartModalBox.style.maxWidth = w ? w + 'px' : '';

  const h = parseInt(link.getAttribute('data-modal-height'), 10);
  if (h) {
    const headerEl = chartModalBox.querySelector('.chart-modal-header');
    const headerH = headerEl ? headerEl.offsetHeight : 0;
    chartModalBox.style.height = (h + headerH) + 'px';
    chartModalBox.style.maxHeight = (h + headerH) + 'px';
  } else {
    chartModalBox.style.height = '';
    chartModalBox.style.maxHeight = '';
  }
  chartModalBox.style.width = '';

  chartModalIframe.src = url;
  document.body.style.overflow = 'hidden';
  chartModalOverlay.classList.add('open');
  chartModalClose.focus();
}

function chartModalClose_() {
  chartModalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  chartModalIframe.src = 'about:blank';
  chartModalBox.style.height = '';
  chartModalBox.style.maxHeight = '';
  chartModalBox.style.width = '';
  if (chartModalLastFocused && typeof chartModalLastFocused.focus === 'function') {
    chartModalLastFocused.focus();
  }
}

window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'chartModalContentHeight') return;
  if (!chartModalOverlay.classList.contains('open')) return;
  const headerEl = chartModalBox.querySelector('.chart-modal-header');
  const headerH = headerEl ? headerEl.offsetHeight : 0;
  const target = Math.min(e.data.height + headerH, window.innerHeight * 0.92);
  chartModalBox.style.height = target + 'px';
  if (typeof e.data.width === 'number' && e.data.width > 0) {
    const targetW = Math.min(e.data.width, window.innerWidth * 0.96);
    chartModalBox.style.width = targetW + 'px';
    chartModalBox.style.maxWidth = targetW + 'px';
  }
});

document.addEventListener('click', (e) => {
  const link = e.target.closest('a[data-type="iframe"]');
  if (!link) return;
  const url = link.getAttribute('href');
  if (!url || url === '#') return;
  e.preventDefault();
  chartModalOpen(link);
});
chartModalClose.addEventListener('click', chartModalClose_);
chartModalOverlay.addEventListener('click', (e) => {
  if (e.target === chartModalOverlay) chartModalClose_();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && chartModalOverlay.classList.contains('open')) chartModalClose_();
});

// ==== DRAG & DROP CARDS ====
const cards = document.querySelectorAll('.card:not(.fixed)');
const wrapper = document.querySelector('.wrapper');

cards.forEach(card => {
  card.addEventListener('dragstart', () => {
    card.classList.add('dragging');
    cardHoverTip.classList.remove('visible');
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
  });
});

wrapper.addEventListener('dragover', e => {
  e.preventDefault();
  const dragging = document.querySelector('.dragging');
  if (!dragging) return;

  const afterElement = getDragAfterElement(wrapper, e.clientX, e.clientY);
  if (afterElement == null) {
    const fixedCards = wrapper.querySelectorAll('.card.fixed');
    const lastFixed = fixedCards.length ? fixedCards[fixedCards.length - 1] : null;
    wrapper.insertBefore(dragging, lastFixed || wrapper.querySelector('footer'));
  } else {
    wrapper.insertBefore(dragging, afterElement);
  }
});

function getDragAfterElement(container, x, y) {
  const draggableElements = [...container.querySelectorAll('.card:not(.dragging):not(.fixed)')];
  if (!draggableElements.length) return null;

  const rows = [];
  draggableElements
    .slice()
    .sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top)
    .forEach(el => {
      const box = el.getBoundingClientRect();
      const centerY = box.top + box.height / 2;
      let row = rows.find(r => Math.abs(r.centerY - centerY) < box.height / 2);
      if (!row) {
        row = { centerY: centerY, elements: [] };
        rows.push(row);
      }
      row.elements.push(el);
    });

  let targetRow = rows[0];
  let minDist = Infinity;
  rows.forEach(row => {
    const dist = Math.abs(row.centerY - y);
    if (dist < minDist) { minDist = dist; targetRow = row; }
  });

  const withinRow = targetRow.elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY });

  if (withinRow.element) return withinRow.element;

  const lastInRow = targetRow.elements[targetRow.elements.length - 1];
  return lastInRow.nextElementSibling;
}

// ==== CARD HOVER TOOLTIP ====
const cardHoverTip = document.getElementById('cardHoverTip');
let cardHoverTipTimer = null;
document.querySelectorAll('.card').forEach(card => {
  card.addEventListener('mouseenter', (e) => {
    const link = card.querySelector('a.card-whole-link');
    const lines = [];
    if (link) {
      const chartType = link.getAttribute('data-modal') || 'chart';
      lines.push(chartType === 'Timelapse'
        ? 'Click to view timelapse'
        : 'Click and release to open ' + chartType + ' charts');
    }
    if (card.getAttribute('draggable') === 'true') {
      lines.push('Click and hold to drag and drop cards into preferred position');
    }
    if (!lines.length) return;
    cardHoverTip.innerHTML = lines.join('<br>');
    cardHoverTip.style.left = (e.clientX + 14) + 'px';
    cardHoverTip.style.top = (e.clientY + 14) + 'px';
    cardHoverTip.classList.add('visible');
    clearTimeout(cardHoverTipTimer);
    cardHoverTipTimer = setTimeout(() => {
      cardHoverTip.classList.remove('visible');
    }, 10000);
  });
  card.addEventListener('mousemove', (e) => {
    cardHoverTip.style.left = (e.clientX + 14) + 'px';
    cardHoverTip.style.top = (e.clientY + 14) + 'px';
  });
  card.addEventListener('mouseleave', () => {
    cardHoverTip.classList.remove('visible');
    clearTimeout(cardHoverTipTimer);
  });
});

// ==== RESPONSIVE HELPERS ====
function cardsPerRow() {
  const cards = document.querySelectorAll('.card:not(.card-not-enabled)');
  if (!cards.length) return 0;
  const wrapperWidth = wrapper.clientWidth;
  const cardWidth = parseInt(getComputedStyle(cards[0]).width);
  const gap = 4;
  return Math.floor((wrapperWidth + gap) / (cardWidth + gap));
}

// ==== HIDE INCOMPLETE ROWS ====
// NOTE: this used to hide the trailing (total % cardsPerRow()) cards to
// avoid a visually ragged final row -- e.g. 19 enabled cards at 5 per
// row left the last 4 hidden (19 % 5 = 4), which looked like a bug
// ("cards flash up on load, then some disappear") rather than the
// intentional layout choice it was. Changed on request: every enabled
// card is now always shown, even if that leaves the last row short.
// cardsPerRow() itself is UNCHANGED and still used elsewhere
// (updateFooterVisibility, updateNavCollapse) -- only the hiding logic
// that lived in this function is gone.
function hideIncompleteRow() {
  document.querySelectorAll('.card:not(.card-not-enabled)').forEach(c => c.style.display = 'block');
}

// ==== FOOTER VISIBILITY ====
function updateFooterVisibility() {
  const footerEl = document.querySelector('footer');
  if (!footerEl) return;
  footerEl.classList.toggle('footer-hidden', cardsPerRow() <= 2);
}

// ==== NAVBAR COLLAPSE ====
function updateNavCollapse() {
  const navbar = document.getElementById('navbar');
  const navWrap = document.querySelector('.nav-wrap');
  const menuInner = document.querySelector('.menu-inner');
  const menuBtn = document.getElementById('menuBtn');
  if (!navbar || !navWrap || !menuInner || !menuBtn) return;

  const collapsed = cardsPerRow() <= 3;
  if (collapsed && navbar.parentElement !== menuInner) {
    navbar.classList.add('site-nav--menu');
    menuInner.appendChild(navbar);
  } else if (!collapsed && navbar.parentElement !== navWrap) {
    navbar.classList.remove('site-nav--menu');
    navWrap.insertBefore(navbar, menuBtn);
  }
  menuBtn.style.display = collapsed ? 'flex' : 'none';
}

// ==== SITE TITLE ====
const ARCHIVE_JSON_URL = './jsondata/archive.json';
function setStationTitle() {
  fetch(ARCHIVE_JSON_URL + ((ARCHIVE_JSON_URL).indexOf('?')>-1?'&':'?') + '_=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const loc = data && data.meta && data.meta.station_location;
      const el = document.querySelector('.brand-text');
      if (loc && el) el.textContent = loc;
      const weewxVer = data && data.meta && data.meta.software_version;
      const weewxEl = document.getElementById('footerWeewxVer');
      if (weewxVer && weewxEl) weewxEl.textContent = weewxVer;
      const pyVer = data && data.meta && data.meta.python_version;
      const pyEl = document.getElementById('footerPyVer');
      if (pyVer && pyEl) pyEl.textContent = pyVer;
      const osVer = data && data.meta && data.meta.os_version;
      const osEl = document.getElementById('footerOsVer');
      if (osVer && osEl) osEl.textContent = osVer;
    })
    .catch(e => console.warn('dashboard: station_location fetch failed —', e.message));
}

function includeHTML(callback) {
  const elements = document.querySelectorAll('[w3-include-html]');
  let pending = elements.length;
  if (pending === 0) { if (callback) callback(); return; }
  elements.forEach(el => {
    const file = el.getAttribute('w3-include-html');
    fetch(file, { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(html => { el.innerHTML = html; el.removeAttribute('w3-include-html'); })
      .catch(e => {
        console.warn('dashboard: include failed for', file, '—', e.message);
        el.innerHTML = '';
      })
      .finally(() => { pending--; if (pending === 0 && callback) callback(); });
  });
}

window.addEventListener('resize', hideIncompleteRow);
window.addEventListener('resize', updateNavCollapse);
window.addEventListener('resize', updateFooterVisibility);
includeHTML(() => {
  document.getElementById('menuBtn').onclick = () => {
    document.body.classList.toggle('menu-open');
  };
  document.getElementById('themeToggle').onclick = () => {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(getThemeMode()) + 1) % THEME_ORDER.length];
    localStorage.setItem(THEME_KEY, next);
    applyDashboardTheme();
  };
  applyDashboardTheme();
  populateUnitSelector();
  broadcastUnitSystem();
  populateLanguageSelector();
  updateNavCollapse();
  setStationTitle();
});
window.addEventListener('load', hideIncompleteRow);
window.addEventListener('load', updateFooterVisibility);
</script>
<script>
// ==== CARD VISIBILITY (replaces the old dynamic-script-loader approach) ====
(function(){
  fetch('./jsondata/archive.json' + '?_=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      var enabled = data && data.meta && data.meta.enabled_cards;
      if (!Array.isArray(enabled) || enabled.length === 0) return;
      document.querySelectorAll('.card[data-card-id]').forEach(function(el){
        if (enabled.indexOf(el.dataset.cardId) === -1) el.classList.add('card-not-enabled');
      });
      if (typeof hideIncompleteRow === 'function') hideIncompleteRow();
      if (typeof updateFooterVisibility === 'function') updateFooterVisibility();
    })
    .catch(function(){ });
})();
</script>
