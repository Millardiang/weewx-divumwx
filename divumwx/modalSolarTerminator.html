<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Solar Terminator</title>

<style>
:root{
  /* Values now match modalAuroraTerminator.html's --bg-color-dark/
     --bg-color-light exactly (#111834 navy / #FFFFFF white). The
     previous values (#292E35 grey / #EFECE2 cream) were simply the
     wrong colors -- not a theme-detection or specificity problem at
     all, data-theme was already resolving correctly, it just pointed
     at colors that didn't match Aurora's. */
  --bs-body-bg: #111834;
  --bs-body-color: #E9E4D4;
  --bs-secondary-color: #8B93B8;
  --bs-star-color: rgb(0,150,250);
}
[data-theme="light"]{
  --bs-body-bg: #FFFFFF;
  --bs-body-color: #1D2C4E;
  --bs-secondary-color: #5C6672;
  --bs-star-color: rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; }
body {
  background: var(--bs-body-bg);
  color: var(--bs-body-color);
  transition: background-color .2s, color .2s;
}
.solarTerminator { display:flex; justify-content:center; align-items:center; padding: 16px 0; }
.ocean { fill: url(#oceanGradient); }
.graticule { fill: none; stroke: var(--bs-secondary-color); stroke-width: 0.2px; stroke-opacity: 0.6; }
.land { fill: url(#landGradient); }
.borders { fill: none; stroke: #1c3d29; stroke-width: 0.2px; }
.night { stroke-width: 0.1px; stroke: #0e1116; fill: #0e1116; fill-opacity: 0.20; }
.civiltwilight { stroke-width: 0.1px; stroke: #0e1116; fill: #0e1116; fill-opacity: 0.35; }
.nauticaltwilight { stroke-width: 0.1px; stroke: #0e1116; fill: #0e1116; fill-opacity: 0.50; }
.astronomicaltwilight { stroke-width: 0.1px; stroke: #0e1116; fill: #0e1116; fill-opacity: 0.60; }

.dot { fill: #ff4444; }
.ring { fill: none; stroke: #ff4444; stroke-width: 1px; }

.meridian180 { stroke: #ff4444; stroke-width: 0.5px; fill: none; }
.gmt_meridian { stroke: #ff4444; stroke-width: 0.5px; fill: none; }
.equator { stroke: #ff4444; stroke-width: 0.5px; fill: none; }
.capricorn { stroke: #3b82f6; stroke-width: 0.5px; fill: none; stroke-dasharray: 3,3; }
.cancer { stroke: #3b82f6; stroke-width: 0.5px; fill: none; stroke-dasharray: 3,3; }
.arctic { stroke: #e64bd6; stroke-width: 0.5px; fill: none; stroke-dasharray: 3,3; }
.antarctic { stroke: #e64bd6; stroke-width: 0.5px; fill: none; stroke-dasharray: 3,3; }
.ecliptic { stroke: #f8d747; stroke-width: 0.5px; fill: none; }

.sun { mask: url(#globeMaskSun); fill: url(#sunGradient); }
.moon { mask: url(#globeMaskMoon); fill: url(#moonGradient); }

#globeMaskSun rect { fill: #fff; }
#globeMaskMoon rect { fill: #fff; }
#globeMaskCircleSun { fill: #000; opacity: 0; }
#globeMaskCircleMoon { fill: #000; opacity: 0; }
#globeMaskCircleSun.behind { opacity: 1; }
#globeMaskCircleMoon.behind { opacity: 1; }

.stars { fill: var(--bs-star-color); }
</style>
<style>

[data-season="winter"] {
  --card-bg: #e9f2ec; --card-bg-dark: #e9f2ec; --card-bg-light: #e9f2ec;
  --bg-color: #e9f2ec; --bg-color-dark: #e9f2ec; --bg-color-light: #e9f2ec;
  --bs-body-bg: #e9f2ec; --bs-card-bg: #e9f2ec; --bg: #e9f2ec;
}
[data-season="spring"] {
  --card-bg: #eef7e3; --card-bg-dark: #eef7e3; --card-bg-light: #eef7e3;
  --bg-color: #eef7e3; --bg-color-dark: #eef7e3; --bg-color-light: #eef7e3;
  --bs-body-bg: #eef7e3; --bs-card-bg: #eef7e3; --bg: #eef7e3;
}
[data-season="summer"] {
  --card-bg: #fff6d9; --card-bg-dark: #fff6d9; --card-bg-light: #fff6d9;
  --bg-color: #fff6d9; --bg-color-dark: #fff6d9; --bg-color-light: #fff6d9;
  --bs-body-bg: #fff6d9; --bs-card-bg: #fff6d9; --bg: #fff6d9;
}
[data-season="autumn"] {
  --card-bg: #f2e6d8; --card-bg-dark: #f2e6d8; --card-bg-light: #f2e6d8;
  --bg-color: #f2e6d8; --bg-color-dark: #f2e6d8; --bg-color-light: #f2e6d8;
  --bs-body-bg: #f2e6d8; --bs-card-bg: #f2e6d8; --bg: #f2e6d8;
}
html[data-season="winter"] body, html[data-season="spring"] body,
html[data-season="summer"] body, html[data-season="autumn"] body {
  background-color: var(--bg-color, var(--card-bg));
}
</style>
</head>
<body>

<div class="solarTerminator"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function(){

  function fromParentTheme(){
    try {
      var b = window.parent && window.parent.document && window.parent.document.body;
      if (b && (b.classList.contains('dark') || b.classList.contains('light'))) {
        return b.classList.contains('dark') ? 'dark' : 'light';
      }
    } catch (e) {}
    return null;
  }
  function applyTheme(){
    var resolved = fromParentTheme();
    if (!resolved) {
      const mode = localStorage.getItem('dashboardThemeMode') || 'auto';
      resolved = mode === 'light' ? 'light' : mode === 'dark' ? 'dark'
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    document.documentElement.setAttribute('data-theme', resolved);
  }
  applyTheme();
  window.addEventListener('storage', function(e){ if (e.key === 'dashboardThemeMode') applyTheme(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  try {
    var __pb = window.parent && window.parent.document && window.parent.document.body;
    if (__pb) new MutationObserver(applyTheme).observe(__pb, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}

  function reportHeight(){
    if (window.parent === window) return;
    var svgEl = document.querySelector('.solarTerminator svg');
    var w, h;
    if (svgEl) {
      var r = svgEl.getBoundingClientRect();
      w = r.width || document.body.scrollWidth;
      h = r.height || document.body.scrollHeight;
    } else {
      w = document.body.scrollWidth;
      h = document.body.scrollHeight;
    }
    window.parent.postMessage({ type: 'chartModalContentHeight', height: Math.ceil(h), width: Math.ceil(w) }, '*');
  }
  if (window.parent !== window) new ResizeObserver(reportHeight).observe(document.body);

  var π = Math.PI;
  function toDegrees(x){ return x * (180 / π); }
  function toRadians(x){ return x * (π / 180); }

  function meanObliquityOfEcliptic(T){
    return toRadians(23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60);
  }
  function eccentricityEarthOrbit(T){ return 0.016708634 - T * (0.000042037 + 0.0000001267 * T); }
  function solarGeometricMeanAnomaly(T){ return toRadians(357.52911 + T * (35999.05029 - 0.0001537 * T)); }
  function solarGeometricMeanLongitude(T){
    var l = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
    return (l < 0 ? l + 360 : l) * π / 180;
  }
  function solarEquationOfCenter(T){
    var m = solarGeometricMeanAnomaly(T);
    return toRadians(
      Math.sin(m) * (1.914602 - T * (0.004817 + 0.000014 * T)) +
      Math.sin(2 * m) * (0.019993 - 0.000101 * T) +
      Math.sin(3 * m) * 0.000289
    );
  }
  function obliquityCorrection(T){
    return meanObliquityOfEcliptic(T) + toRadians(0.00256 * Math.cos(toRadians(125.04 - 1934.136 * T)));
  }
  function solarTrueLongitude(T){ return solarGeometricMeanLongitude(T) + solarEquationOfCenter(T); }
  function solarApparentLongitude(T){
    return solarTrueLongitude(T) - toRadians(0.00569 + 0.00478 * Math.sin(toRadians(125.04 - 1934.136 * T)));
  }
  function solarDeclination(T){
    return Math.asin(Math.sin(obliquityCorrection(T)) * Math.sin(solarApparentLongitude(T)));
  }
  function equationOfTime(T){
    var e = eccentricityEarthOrbit(T), m = solarGeometricMeanAnomaly(T), l = solarGeometricMeanLongitude(T);
    var y = Math.tan(obliquityCorrection(T) / 2); y *= y;
    return y * Math.sin(2 * l) - 2 * e * Math.sin(m) + 4 * e * y * Math.sin(m) * Math.cos(2 * l)
         - 0.5 * y * y * Math.sin(4 * l) - 1.25 * e * e * Math.sin(2 * m);
  }
  function solarPosition(time){
    var T = (time - Date.UTC(2000, 0, 1, 12)) / 864e5 / 36525;
    var longitude = (d3.utcDay.floor(time) - time) / 864e5 * 360 - 180;
    return [longitude - toDegrees(equationOfTime(T)), toDegrees(solarDeclination(T))];
  }
  function antipode(pos){ return [pos[0] + 180, -pos[1]]; }

  var w = 790, h = 500;
  var center = [w / 2, h / 2];

  var lat = 51.94, lon = -0.987, moonDec = 0, moonEclipticAngle = 0, eclipticAngle = 0;
  var worldData = null;

  var svg = d3.select('.solarTerminator').append('svg').attr('width', w).attr('height', h);

  var dots = 150;
  var stars = [];
  for (var i = 0; i < dots; i++){
    stars.push({ position: [Math.random() * w, Math.random() * h], radius: 0.5 });
  }
  svg.selectAll('.stars').data(stars).enter().append('circle')
    .attr('class', 'stars')
    .attr('r', function(d){ return d.radius; })
    .attr('cx', function(d){ return d.position[0]; })
    .attr('cy', function(d){ return d.position[1]; });

  var defs = svg.append('defs');
  var sunScale = d3.scaleLinear().domain([0, 1]).range([5, 25]);
  var moonScale = d3.scaleLinear().domain([0, 1]).range([2, 8]);

  var earth, skynet, lunar, path, graticule;
  var built = false;

  function buildProjections(eclipticDeg){
    var rotSign = (lat > 0) ? -1 : 1;
    var rotBase = [-lon, rotSign * eclipticDeg, -eclipticDeg];

    earth = d3.geoOrthographic().scale(200).translate(center).clipAngle(90).rotate(rotBase).precision(0.1);
    skynet = d3.geoOrthographic().scale(235).rotate(rotBase).translate(earth.translate());
    lunar = d3.geoOrthographic().scale(217).rotate(rotBase).translate(earth.translate());

    path = d3.geoPath().projection(earth);
    graticule = d3.geoGraticule();
  }

  function buildDefs(){
    defs.append('path').datum({ type: 'Sphere' }).attr('id', 'sphere').attr('d', path);

    var globeMaskSun = defs.append('mask').attr('id', 'globeMaskSun').attr('x', 0).attr('y', 0).attr('width', w).attr('height', h);
    globeMaskSun.append('rect').attr('x', 0).attr('y', 0).attr('width', w).attr('height', h);
    globeMaskSun.append('use').attr('id', 'globeMaskCircleSun').attr('xlink:href', '#sphere');

    var globeMaskMoon = defs.append('mask').attr('id', 'globeMaskMoon').attr('x', 0).attr('y', 0).attr('width', w).attr('height', h);
    globeMaskMoon.append('rect').attr('x', 0).attr('y', 0).attr('width', w).attr('height', h);
    globeMaskMoon.append('use').attr('id', 'globeMaskCircleMoon').attr('xlink:href', '#sphere');

    function grad(id, light, dark){
      var g = defs.append('radialGradient').attr('id', id).attr('cx', '75%').attr('cy', '25%');
      g.append('stop').attr('offset', '5%').attr('stop-color', light);
      g.append('stop').attr('offset', '150%').attr('stop-color', dark);
    }
    grad('sunGradient', '#ffcfc7', '#ff6347');
    grad('moonGradient', '#f5f5f5', '#999999');
    grad('oceanGradient', '#d4e2ff', '#99bbff');
    grad('landGradient', '#44c17b', '#2e8b57');
  }

  function buildGlobe(){
    svg.append('use').attr('class', 'ocean').attr('xlink:href', '#sphere');

    if (worldData && worldData.objects && worldData.objects.land){
      svg.append('path').datum(topojson.feature(worldData, worldData.objects.land)).attr('class', 'land');
    }
    if (worldData && worldData.objects && worldData.objects.countries){
      svg.append('path').datum(topojson.mesh(worldData, worldData.objects.countries, function(a, b){ return a !== b; })).attr('class', 'borders');
    }

    svg.append('path').datum(graticule).attr('class', 'graticule');

    var meridian180 = d3.geoGraticule().step([179.9999, 0])
      .extentMajor([[179.9999, -90 + 1e-6], [180, 90 - 1e-6]])
      .extentMinor([[179.9999, -90 - 1e-6], [180, 90 + 1e-6]]);
    svg.append('path').datum(meridian180).attr('class', 'meridian180');

    var gmt_meridian = d3.geoGraticule().step([90, 0]).extent([[-0.1, -90 - 1e-6], [0.1, 90 + 1e-6]]);
    svg.append('path').datum(gmt_meridian).attr('class', 'gmt_meridian');

    var equator = d3.geoGraticule().step([0, 90]).extent([[-180, -1], [180, 1]]);
    svg.append('path').datum(equator).attr('class', 'equator');

    var capricorn = d3.geoGraticule().step([0, 23.436556])
      .extentMajor([[-180, -23.536556 + 1e-6], [180, 0]])
      .extentMinor([[-180, -23.536556 - 1e-6], [180, -23.536556 + 1e-6]]);
    svg.append('path').datum(capricorn).attr('class', 'capricorn');

    var cancer = d3.geoGraticule().step([0, 23.436556])
      .extentMajor([[-180, 23.436556 + 1e-6], [180, 23.436556 - 1e-6]])
      .extentMinor([[-180, -23.436556 - 1e-6], [180, 23.436556 + 1e-6]]);
    svg.append('path').datum(cancer).attr('class', 'cancer');

    var arctic = d3.geoGraticule().step([0, 66.563444])
      .extentMajor([[-180, 66.563444 + 1e-6], [180, 66.563444 - 1e-6]])
      .extentMinor([[-180, 0], [180, 0]]);
    svg.append('path').datum(arctic).attr('class', 'arctic');

    var antarctic = d3.geoGraticule().step([0, 66.563444])
      .extentMajor([[-180, -66.563444], [180, 0]])
      .extentMinor([[-180, -66.563444 - 1e-6], [180, -66.563444 + 1e-6]]);
    svg.append('path').datum(antarctic).attr('class', 'antarctic');

    svg.append('path').attr('class', 'night');
    svg.append('path').attr('class', 'civiltwilight');
    svg.append('path').attr('class', 'nauticaltwilight');
    svg.append('path').attr('class', 'astronomicaltwilight');

    svg.append('circle').attr('class', 'moon');
    svg.append('circle').attr('class', 'sun');
  }

  function degreesFromCenterSun(pos){ return toDegrees(d3.geoDistance(pos, skynet.invert(center))); }
  function degreesFromCenterMoon(pos){ return toDegrees(d3.geoDistance(pos, lunar.invert(center))); }

  function redraw(eclipticDeg){
    var now = new Date();
    var sunPos = solarPosition(now.getTime());
    var moonPos = [sunPos[0] + moonEclipticAngle, moonDec];
    var antiSunPos = antipode(sunPos);

    var noonSun = { earth: earth(sunPos), skynet: skynet(sunPos) };
    var noonMoon = { earth: earth(moonPos), lunar: lunar(moonPos) };

    d3.selectAll('.night').datum(d3.geoCircle().radius(90).center(antiSunPos)()).attr('d', path);
    d3.selectAll('.civiltwilight').datum(d3.geoCircle().radius(84).center(antiSunPos)()).attr('d', path);
    d3.selectAll('.nauticaltwilight').datum(d3.geoCircle().radius(78).center(antiSunPos)()).attr('d', path);
    d3.selectAll('.astronomicaltwilight').datum(d3.geoCircle().radius(72).center(antiSunPos)()).attr('d', path);

    d3.select('#oceanGradient').attr('cx', ((noonSun.earth[0] - (w - h) / 2) / h * 100) + '%').attr('cy', (noonSun.earth[1] / h * 100) + '%');
    d3.select('#landGradient').attr('cx', ((noonSun.earth[0] - (w - h) / 2) / h * 100) + '%').attr('cy', (noonSun.earth[1] / h * 100) + '%');

    var sunSizeFactor = 1 - (degreesFromCenterSun(sunPos) / 180);
    var moonSizeFactor = 1 - (degreesFromCenterMoon(moonPos) / 180);

    d3.select('.sun').attr('cx', noonSun.skynet[0]).attr('cy', noonSun.skynet[1]).attr('r', sunScale(sunSizeFactor));
    d3.select('.moon').attr('cx', noonMoon.lunar[0]).attr('cy', noonMoon.lunar[1]).attr('r', moonScale(moonSizeFactor));

    d3.selectAll('.land').attr('d', path);
    d3.selectAll('.borders').attr('d', path);
    d3.selectAll('.graticule').attr('d', path);
    d3.selectAll('.meridian180').attr('d', path);
    d3.selectAll('.gmt_meridian').attr('d', path);
    d3.selectAll('.equator').attr('d', path);
    d3.selectAll('.capricorn').attr('d', path);
    d3.selectAll('.cancer').attr('d', path);
    d3.selectAll('.arctic').attr('d', path);
    d3.selectAll('.antarctic').attr('d', path);
    d3.selectAll('.ecliptic').attr('d', path);

    d3.select('#globeMaskCircleSun').classed('behind', degreesFromCenterSun(sunPos) > 90);
    d3.select('#globeMaskCircleMoon').classed('behind', degreesFromCenterMoon(moonPos) > 90);

    reportHeight();
  }

  var pulseTimer = null;
  function startLocationPulse(){
    if (pulseTimer) return;
    pulseTimer = setInterval(function(){
      svg.append('circle').attr('class', 'dot').attr('transform', 'translate(' + earth([lon, lat]) + ')').attr('r', 1);
      svg.append('circle').attr('class', 'ring').attr('transform', 'translate(' + earth([lon, lat]) + ')').attr('r', 2)
        .transition().ease(d3.easeLinear).duration(6000)
        .style('stroke-opacity', 1e-6).attr('r', 20).remove();
    }, 1000);
  }

  function ensureBuilt(eclipticDeg){
    if (built) return;
    built = true;
    buildProjections(eclipticDeg);
    buildDefs();
    buildGlobe();
    svg.append('path').datum({ type: 'LineString', coordinates: [[-180, 0], [-90, -eclipticDeg], [0, 0], [90, eclipticDeg], [180, 0]] }).attr('class', 'ecliptic');
    startLocationPulse();
  }

  function refresh(){
    Promise.allSettled([
      fetch('./jsondata/almanac.json?_=' + Date.now(), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch('./jsondata/archive.json?_=' + Date.now(), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      worldData ? Promise.resolve(worldData) : fetch('./jsondata/worldmap.json?_=' + Date.now(), { cache: 'no-store' }).then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    ]).then(function(results){
      var alm = results[0].status === 'fulfilled' ? results[0].value : {};
      var arch = results[1].status === 'fulfilled' ? results[1].value : {};
      if (results[2].status === 'fulfilled') worldData = results[2].value;

      var meta = arch.meta || {};
      function num(x, fallback){ return (typeof x === 'number' && !isNaN(x)) ? x : fallback; }
      moonDec = num(alm['almanac.moon.dec'], moonDec);
      moonEclipticAngle = num(alm['almanac.moon.ecliptic_angle'], moonEclipticAngle);
      eclipticAngle = num(alm['almanac.ecliptic_obliquity'], eclipticAngle);
      lat = num(meta.latitude, lat); lon = num(meta.longitude, lon);

      ensureBuilt(eclipticAngle);
      redraw(eclipticAngle);
    }).catch(function(e){ console.warn('modalSolarTerminator: refresh failed —', e.message); });
  }

  refresh();
  setInterval(refresh, 60000);

})();
</script>
<script>
(function applySeasonFromParent(){
  function apply(){
    try {
      var b = window.parent && window.parent.document && window.parent.document.body;
      var m = b && /season-(winter|spring|summer|autumn)/.exec(b.className);
      if (m) document.documentElement.setAttribute('data-season', m[1]);
      else document.documentElement.removeAttribute('data-season');
    } catch (e) {}
  }
  apply();
  try {
    var pb = window.parent && window.parent.document && window.parent.document.body;
    if (pb) new MutationObserver(apply).observe(pb, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();
</script>
</body>
</html>
