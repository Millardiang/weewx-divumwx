<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geomagnetic Activity</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>
:root {
  --bg-color-light: #FFFFFF;
  --bg-color-dark: #111834;
  --text-color-light: #1D2C4E;
  --text-color-dark: #E9E4D4;
  --grid-color-dark: rgba(192,192,192,0.15);
  --grid-color-light: rgba(28,66,99,0.15);
  --green: #4caf50;
  --yellow: #d4c02b;
  --amber: #e6a141;
  --red: #d35d4e;
}
html, body { margin: 0; padding: 0; }
body {
  font-family: Helvetica, Arial, sans-serif;
  background: var(--bg-color-dark);
  color: var(--text-color-dark);
}
[data-theme="light"] body { background: var(--bg-color-light); color: var(--text-color-light); }
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 14px 12px 16px; box-sizing: border-box; }
.header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
.title { font-size: 14px; font-weight: 600; }
.currentPill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 12px; border: 1px solid currentColor; }
.currentPill .dot { width: 8px; height: 8px; border-radius: 50%; }
.sub { font-size: 10px; opacity: 0.7; margin-bottom: 10px; }
#chartHost { width: 100%; }
#chartHost svg { width: 100%; height: auto; display: block; }
.axis text { font-size: 8.5px; fill: currentColor; opacity: 0.8; }
.axis path, .axis line { stroke: currentColor; opacity: 0.25; }
.gridline { stroke: currentColor; opacity: 0.1; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 9.5px; margin-top: 8px; flex-wrap: wrap; opacity: 0.85; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend .sw { width: 9px; height: 9px; border-radius: 2px; }
.errorMsg { text-align: center; font-size: 11px; opacity: 0.75; padding: 30px; }
</style>
<style>

[data-season="winter"] {
  --card-bg: #e9f2ec; --card-bg-dark: #e9f2ec; --card-bg-light: #e9f2ec;
  --bg-color: #e9f2ec; --bg-color-dark: #e9f2ec; --bg-color-light: #e9f2ec;
  --bs-body-bg: #e9f2ec; --bs-card-bg: #e9f2ec; --bg: #e9f2ec;
}
[data-season="spring"] {
  --card-bg: #eef7e3; --card-bg-dark: #eef7e3; --card-bg-light: #eef7e3;
  --bg-color: #eef7e3; --bg-color-dark: #eef7e3; --bg-color-light: #eef7e3;
  --bs-body-bg: #eef7e3; --bs-card-bg: #eef7e3; --bg: #eef7e3;
}
[data-season="summer"] {
  --card-bg: #fff6d9; --card-bg-dark: #fff6d9; --card-bg-light: #fff6d9;
  --bg-color: #fff6d9; --bg-color-dark: #fff6d9; --bg-color-light: #fff6d9;
  --bs-body-bg: #fff6d9; --bs-card-bg: #fff6d9; --bg: #fff6d9;
}
[data-season="autumn"] {
  --card-bg: #f2e6d8; --card-bg-dark: #f2e6d8; --card-bg-light: #f2e6d8;
  --bg-color: #f2e6d8; --bg-color-dark: #f2e6d8; --bg-color-light: #f2e6d8;
  --bs-body-bg: #f2e6d8; --bs-card-bg: #f2e6d8; --bg: #f2e6d8;
}
html[data-season="winter"] body, html[data-season="spring"] body,
html[data-season="summer"] body, html[data-season="autumn"] body {
  background-color: var(--bg-color, var(--card-bg));
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <span class="title">Geomagnetic Activity (AuroraWatch UK)</span>
    <span class="currentPill" id="currentPill"><span class="dot" id="currentDot"></span><span id="currentText">&mdash;</span></span>
  </div>
  <div class="sub" id="subLine">Loading&hellip;</div>
  <div id="chartHost"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--green)"></span>Green</span>
    <span><span class="sw" style="background:var(--yellow)"></span>Yellow</span>
    <span><span class="sw" style="background:var(--amber)"></span>Amber</span>
    <span><span class="sw" style="background:var(--red)"></span>Red</span>
  </div>
</div>

<script src="js/d3.7.9.0.min.js"></script>
<script>
(function(){

(function applyTheme(){

  function fromParent(){
    try {
      var b = window.parent && window.parent.document && window.parent.document.body;
      if (b && (b.classList.contains('dark') || b.classList.contains('light'))) {
        return b.classList.contains('dark') ? 'dark' : 'light';
      }
    } catch (e) {}
    return null;
  }
  function fromLocal(){
    var mode = localStorage.getItem('dashboardThemeMode') || 'auto';
    return mode === 'light' ? 'light' : mode === 'dark' ? 'dark'
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function apply(){
    document.documentElement.setAttribute('data-theme', fromParent() || fromLocal());
  }
  apply();

  try {
    var pb = window.parent && window.parent.document && window.parent.document.body;
    if (pb) new MutationObserver(apply).observe(pb, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();

  function reportHeight(){
    if (window.parent === window) return;
    window.parent.postMessage({ type: 'chartModalContentHeight', height: document.body.scrollHeight, width: document.body.scrollWidth }, '*');
  }
  if (window.parent !== window) new ResizeObserver(reportHeight).observe(document.body);

  var STATUS_COLOR = { green: 'var(--green)', yellow: 'var(--yellow)', amber: 'var(--amber)', red: 'var(--red)' };
  var STATUS_HEX = { green: '#4caf50', yellow: '#d4c02b', amber: '#e6a141', red: '#d35d4e' };

  function parseAuroraXml(xmlText){
    var xml = new DOMParser().parseFromString(xmlText, 'text/xml');
    if (xml.querySelector('parsererror')) throw new Error('aurora.txt did not parse as XML');

    var thresholds = {};
    xml.querySelectorAll('lower_threshold').forEach(function(el){
      thresholds[el.getAttribute('status_id')] = Number(el.textContent);
    });

    var updatedEl = xml.querySelector('updated > datetime');
    var updated = updatedEl ? new Date(updatedEl.textContent) : null;

    var activities = Array.prototype.map.call(xml.querySelectorAll('activity'), function(el){
      return {
        status: el.getAttribute('status_id'),
        datetime: new Date(el.querySelector('datetime').textContent),
        value: Number(el.querySelector('value').textContent)
      };
    });

    return { thresholds: thresholds, updated: updated, activities: activities };
  }

  function render(data){
    var activities = data.activities;
    if (!activities.length) throw new Error('no activity readings found');

    var latest = activities[activities.length - 1];
    document.getElementById('currentText').textContent = latest.value.toFixed(1) + ' nT \u2014 ' + latest.status.charAt(0).toUpperCase() + latest.status.slice(1);
    document.getElementById('currentDot').style.background = STATUS_HEX[latest.status] || '#999';
    document.getElementById('currentPill').style.borderColor = STATUS_HEX[latest.status] || 'currentColor';
    var subBits = [];
    if (data.updated) subBits.push('Updated ' + data.updated.toLocaleString());
    subBits.push(activities.length + ' readings shown');
    document.getElementById('subLine').textContent = subBits.join(' \u2022 ');

    var W = 1150, H = 340, margin = { top: 16, right: 16, bottom: 28, left: 40 };
    var innerW = W - margin.left - margin.right;
    var innerH = H - margin.top - margin.bottom;

    document.getElementById('chartHost').innerHTML = '';
    var svg = d3.select('#chartHost').append('svg')
      .attr('viewBox', '0 0 ' + W + ' ' + H).attr('width', '100%');
    var g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    var x = d3.scaleTime()
      .domain(d3.extent(activities, function(d){ return d.datetime; }))
      .range([0, innerW]);
    var maxVal = Math.max(d3.max(activities, function(d){ return d.value; }), data.thresholds.amber || 100);
    var y = d3.scaleLinear()
      .domain([0, maxVal * 1.1])
      .range([innerH, 0]);

    var bandOrder = ['green', 'yellow', 'amber', 'red'];
    var bandTops = { green: data.thresholds.yellow, yellow: data.thresholds.amber, amber: data.thresholds.red, red: maxVal * 1.1 };
    bandOrder.forEach(function(band){
      var bottom = data.thresholds[band];
      var top = bandTops[band];
      if (bottom == null || top == null) return;
      g.append('rect')
        .attr('x', 0).attr('width', innerW)
        .attr('y', y(top)).attr('height', Math.max(0, y(bottom) - y(top)))
        .style('fill', STATUS_HEX[band]).style('opacity', 0.07);
    });

    g.append('g').attr('class', 'axis')
      .selectAll('line.gridline')
      .data(y.ticks(5)).enter().append('line')
      .attr('class', 'gridline')
      .attr('x1', 0).attr('x2', innerW)
      .attr('y1', function(d){ return y(d); }).attr('y2', function(d){ return y(d); });

    g.append('g').attr('class', 'axis')
      .attr('transform', 'translate(0,' + innerH + ')')
      .call(d3.axisBottom(x).ticks(8).tickFormat(d3.timeFormat('%H:%M')));

    g.append('g').attr('class', 'axis')
      .call(d3.axisLeft(y).ticks(5));

    var line = d3.line()
      .x(function(d){ return x(d.datetime); })
      .y(function(d){ return y(d.value); })
      .curve(d3.curveMonotoneX);

    g.append('path')
      .datum(activities)
      .attr('d', line)
      .style('fill', 'none')
      .style('stroke', 'currentColor')
      .style('stroke-width', 1.3)
      .style('opacity', 0.6);

    g.selectAll('circle.point')
      .data(activities).enter().append('circle')
      .attr('class', 'point')
      .attr('cx', function(d){ return x(d.datetime); })
      .attr('cy', function(d){ return y(d.value); })
      .attr('r', 2.5)
      .style('fill', function(d){ return STATUS_HEX[d.status] || '#999'; })
      .append('title')
      .text(function(d){ return d.datetime.toLocaleString() + ': ' + d.value.toFixed(1) + ' nT (' + d.status + ')'; });

    reportHeight();
  }

  function refresh(){
    fetch('./jsondata/aurora.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(text){
        var data = parseAuroraXml(text);
        render(data);
      })
      .catch(function(e){
        console.warn('modalGeomagneticChart: refresh failed —', e.message);
        document.getElementById('chartHost').innerHTML = '<div class="errorMsg">Chart unavailable (' + e.message + ')</div>';
        reportHeight();
      });
  }

  refresh();
  setInterval(refresh, 5 * 60 * 1000);
})();
</script>
<script>
(function applySeasonFromParent(){
  function apply(){
    try {
      var b = window.parent && window.parent.document && window.parent.document.body;
      var m = b && /season-(winter|spring|summer|autumn)/.exec(b.className);
      if (m) document.documentElement.setAttribute('data-season', m[1]);
      else document.documentElement.removeAttribute('data-season');
    } catch (e) {}
  }
  apply();
  try {
    var pb = window.parent && window.parent.document && window.parent.document.body;
    if (pb) new MutationObserver(apply).observe(pb, { attributes: true, attributeFilter: ['class'] });
  } catch (e) {}
})();
</script>
</body>
</html>
