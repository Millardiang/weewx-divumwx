<script>
// ==== THEME HANDLING ====
// Deliberately the very first thing in <body>, before .container (navbar
// include + page content) can paint. Previously this whole block lived
// further down, and — worse — there was no immediate top-level call to
// applyDashboardTheme() at all: it only ran once includeHTML()'s
// navbar.html fetch resolved, in the callback near the bottom of the
// page. That's what caused the flash: body stayed class="light" (the
// static HTML default) for however long that network request took.
// Logic below is otherwise unchanged; includeHTML()'s callback still
// calls applyDashboardTheme() again once the navbar exists, purely to
// set the #themeToggle button's icon/title (this early call already
// no-ops that part, since the button doesn't exist yet).
const STATION_LAT = 51.94;
const STATION_LON = -0.987;
const THEME_KEY = 'dashboardThemeMode';
const THEME_ICONS = { auto: '\u{1F313}', light: '\u2600\uFE0F', dark: '\u{1F319}' };
const THEME_ORDER = ['dark', 'light', 'auto'];
const SEASON_ICONS = { winter: '\u2744\uFE0F', spring: '\u{1F338}', summer: '\u{1F33B}', autumn: '\u{1F342}' };
const SEASON_CLASSES = ['season-winter', 'season-spring', 'season-summer', 'season-autumn'];
const NORTHERN_SEASON_BY_MONTH = [
  'winter', 'winter', 'spring', 'spring', 'spring', 'summer',
  'summer', 'summer', 'autumn', 'autumn', 'autumn', 'winter'
];
const SEASON_SWAP_SOUTH = { winter: 'summer', summer: 'winter', spring: 'autumn', autumn: 'spring' };
function getMeteorologicalSeason(date, lat) {
  const season = NORTHERN_SEASON_BY_MONTH[date.getMonth()];
  return (lat >= 0) ? season : SEASON_SWAP_SOUTH[season];
}
function seasonLabel(season) {
  if (season === 'autumn' && (localStorage.getItem('dashboardUnitSystem') || 'uk') === 'us') return 'Fall';
  return season.charAt(0).toUpperCase() + season.slice(1);
}
let lastIsDay = null;
const LOOP_JSON_URL_FOR_THEME = './jsondata/loop.json';
const THEME_ISDAY_POLL_MS = 60 * 1000;

function getSunTimes(date, lat, lon) {
  const rad = Math.PI / 180;
  const msPerDay = 86400000;
  const J1970 = 2440588, J2000 = 2451545;
  const toJulian = d => d.valueOf() / msPerDay - 0.5 + J1970;
  const fromJulian = j => new Date((j + 0.5 - J1970) * msPerDay);
  const toDays = d => toJulian(d) - J2000;
  const obliquity = rad * 23.4397;
  const meanAnomaly = d => rad * (357.5291 + 0.98560028 * d);
  const eclipticLon = M => {
    const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    const perihelion = rad * 102.9372;
    return M + C + perihelion + Math.PI;
  };
  const declination = L => Math.asin(Math.sin(L) * Math.sin(obliquity));
  const julianCycle = (d, lw) => Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const approxTransit = (Ht, lw, n) => 0.0009 + (Ht + lw) / (2 * Math.PI) + n;
  const solarTransitJ = (ds, M, L) => J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const hourAngle = (h, phi, dec) => Math.acos((Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const lw = rad * -lon, phi = rad * lat;
  const d = toDays(date);
  const n = julianCycle(d, lw);
  const ds = approxTransit(0, lw, n);
  const M = meanAnomaly(ds);
  const L = eclipticLon(M);
  const dec = declination(L);
  const Jnoon = solarTransitJ(ds, M, L);
  const h0 = -0.833 * rad;
  const H = hourAngle(h0, phi, dec);
  if (isNaN(H)) return null;
  const Jset = solarTransitJ(approxTransit(H, lw, n), M, L);
  const Jrise = Jnoon - (Jset - Jnoon);
  return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset) };
}
function getThemeMode() {
  const stored = localStorage.getItem(THEME_KEY);
  return THEME_ORDER.includes(stored) ? stored : 'auto';
}
function effectiveTheme(mode) {
  if (mode === 'light' || mode === 'dark') return mode;
  if (mode === 'seasonal') return 'light';
  if (lastIsDay != null) return lastIsDay ? 'light' : 'dark';
  const now = new Date();
  const sun = getSunTimes(now, STATION_LAT, STATION_LON);
  if (!sun) return 'light';
  return (now >= sun.sunrise && now < sun.sunset) ? 'light' : 'dark';
}
function applyDashboardTheme() {
  const mode = getThemeMode();
  const resolved = effectiveTheme(mode);
  document.body.classList.remove('light', 'dark');
  document.body.classList.add(resolved);

  // Seasonal accent mode retired site-wide -- see header.js's
  // applySeasonClass() for the full rationale. This page has its own
  // independent inline implementation (doesn't call the shared
  // header.js function at all), so it needed the identical no-op
  // treatment applied directly here. currentSeason kept as a variable
  // (always null now) since it's still referenced below (themechange
  // event detail, theme-toggle button label) and those call sites
  // already handle null correctly -- every other themeMode already
  // exercises that same null path today.
  const currentSeason = null;

  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  if (mode === 'seasonal') {
    btn.textContent = SEASON_ICONS[currentSeason];
    btn.title = 'Seasonal (' + seasonLabel(currentSeason) + ')';
  } else {
    btn.textContent = THEME_ICONS[mode];
    btn.title = mode === 'auto' ? ('Auto (currently ' + resolved + ')') : mode.charAt(0).toUpperCase() + mode.slice(1);
  }
}
function pollIsDayForTheme() {
  fetch(LOOP_JSON_URL_FOR_THEME + '?_=' + Date.now(), { cache: 'no-store' })
    .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(j => {
      const o = (j && j.observations) || {};
      if (o.isDay != null) {
        lastIsDay = o.isDay;
        if (getThemeMode() === 'auto') applyDashboardTheme();
      }
    })
    .catch(e => console.warn('records: loop.json poll (theme) failed —', e.message));
}

// Applied immediately, synchronously, before anything else in <body> is
// parsed — this is what prevents the flash.
applyDashboardTheme();
pollIsDayForTheme();
setInterval(pollIsDayForTheme, THEME_ISDAY_POLL_MS);
setInterval(() => {
  const m = getThemeMode();
  if (m === 'auto' || m === 'seasonal') applyDashboardTheme();
}, 60 * 1000);
</script>

<script>
// NAV_UNIT_KEY/NAV_UNIT_LABELS now come from siteHeader.js -- removed
// the identical const declarations that used to be here (as UNIT_KEY/
// UNIT_LABELS). They MUST come from there now, not be redeclared: a
// later const/let redeclaring an existing var of the same name in the
// same scope is a SyntaxError that would take out this page's entire
// script block, including the records engine below. siteHeader.js uses
// the NAV_-prefixed names specifically to avoid colliding with any
// page's own same-named globals (charts-d3.html has its own unrelated
// UNIT_LABELS, for instance) -- this page's references below were
// updated to match.
let currentUnitSystem = localStorage.getItem(NAV_UNIT_KEY) || 'uk';
// This page's own populateUnitSelector() overrides siteHeader.js's
// generic one (last function declaration with a given name wins, so
// initSharedHeader()'s internal call to populateUnitSelector() picks up
// THIS version) -- kept here rather than folded into the shared file
// because it has page-specific side effects the generic version
// shouldn't have: tracking currentUnitSystem and calling renderAll() to
// actually refresh the records table when units change.
function populateUnitSelector() {
  const select = document.getElementById('unitSystem');
  if (!select) return;
  if (typeof SYSTEMS === 'undefined') { select.disabled = true; return; }
  Object.keys(SYSTEMS).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = NAV_UNIT_LABELS[key] || key;
    select.appendChild(opt);
  });
  select.value = currentUnitSystem;
  select.onchange = () => {
    currentUnitSystem = select.value;
    localStorage.setItem(NAV_UNIT_KEY, select.value);
    window.dispatchEvent(new CustomEvent('unitsystemchange', {
      detail: { system: select.value, config: (typeof SYSTEMS !== 'undefined' ? SYSTEMS[select.value] : null) }
    }));
    if (getThemeMode() === 'seasonal') applyDashboardTheme();
    renderAll();
  };
}
function currentSystemConfig() {
  if (typeof SYSTEMS === 'undefined') return { temp: 'C', wind: 'mph', rain: 'mm' };
  return SYSTEMS[currentUnitSystem] || { temp: 'C', wind: 'mph', rain: 'mm' };
}

const ARCHIVE_JSON_URL = './jsondata/archive.json';
var ENABLED_CARDS = null; // null = unknown yet / fetch failed -- fail open (show everything)

// Card <-> sensor mapping, inlined directly in this page rather than a
// shared external file. A shared cardSensorMap.js was tried first and
// silently failed in the field -- when it wasn't deployed alongside the
// pages that referenced it, every isBaseCardEnabled() call threw a plain
// ReferenceError, which fails with no visible symptom at all (no crash,
// nothing on screen -- gauges/tabs/records just stay visible, exactly as
// if the feature didn't exist). Duplicating this small table in every
// page that needs it costs a little repetition but removes that whole
// failure mode -- there's no second file to forget to deploy.
//
// DELIBERATELY UNMAPPED (left always shown, never hidden): airDen (air
// density -- a software calculation, not a discrete sensor with its own
// card), cloudCover, solarGeneration/solarExport (no confirmed dedicated
// card name for these in any enabled_cards sample seen). Guessing a card
// name for these risks hiding legitimate data, so they're left alone.
var DIVUMWX_CARD_TO_BASES = {
  cardTemperature:            ['outTemp', 'outDew'],
  cardHumidity:                ['outHumid'],
  cardAnemometer:              ['windSpeed', 'windGust'],
  cardWindCompass:             ['windDir'],
  cardBarometer:                ['barom'],
  cardTippingRain:             ['rain', 'rainRate'],
  cardPiezoRain:                ['prain', 'prainRate'],
  cardSolarRadiation:          ['solar', 'solarRadiation'],
  cardUvIndex:                  ['uv'],
  cardVapourPressureDeficit:   ['vpd'],
  cardEvapoTranspiration:      ['evt'],
  cardLightning:                ['lightCount', 'lightDist'],
  cardAirquality:               ['pm1_0', 'pm2_5', 'pm4_0', 'pm10_0', 'aod'],
  cardGreenhouseGas:            ['co', 'co2', 'no2', 'nh3', 'o3', 'so2'],
  cardPollen:                    ['alder', 'birch', 'olive', 'grass', 'mugwort', 'ragweed'],
};
var DIVUMWX_BASE_TO_CARD = {};
Object.keys(DIVUMWX_CARD_TO_BASES).forEach(function(card){
  DIVUMWX_CARD_TO_BASES[card].forEach(function(base){
    DIVUMWX_BASE_TO_CARD[base.toLowerCase()] = card;
  });
});
function isBaseCardEnabled(base, enabledCards) {
  if (!Array.isArray(enabledCards) || enabledCards.length === 0) return true;
  var card = DIVUMWX_BASE_TO_CARD[String(base).toLowerCase()];
  if (!card) return true; // unmapped base -- see DELIBERATELY UNMAPPED above
  return enabledCards.indexOf(card) !== -1;
}

function setStationTitle() {
  fetch(ARCHIVE_JSON_URL + '?_=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const loc = data && data.meta && data.meta.station_location;
      const el = document.querySelector('.brand-text');
      if (loc && el) el.textContent = loc;
      const cards = data && data.meta && data.meta.enabled_cards;
      if (Array.isArray(cards) && cards.length) {
        ENABLED_CARDS = cards;
        renderAll();
      }
    })
    .catch(e => console.warn('records: station_location/enabled_cards fetch failed —', e.message));
}

// includeHTML, populateLanguageSelector, and translateNavbar all now
// live in siteHeader.js -- one shared copy for every page, instead of
// this page's own separate copies.

window.addEventListener('storage', e => {
  if (e.key === THEME_KEY) applyDashboardTheme();
});

includeHTML(() => {
  initSharedHeader();
  document.getElementById('menuBtn').onclick = () => { document.body.classList.toggle('menu-open'); };
  document.getElementById('themeToggle').onclick = () => {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(getThemeMode()) + 1) % THEME_ORDER.length];
    localStorage.setItem(THEME_KEY, next);
    applyDashboardTheme();
  };
  applyDashboardTheme();
  setStationTitle();
});

];
const CATEGORY_ORDER = ['Temperature & Humidity', 'Wind', 'Rain', 'Pressure', 'Solar & UV', 'Air Quality', 'Pollen', 'Other'];

// -- key parsing: base + kind (max/min/avg/raw) + granularity (hourly/daily) --
function parseSeriesKey(key) {
  const suffixMap = [
    ['MaxHourly', 'max', 'hourly'], ['MinHourly', 'min', 'hourly'], ['AvgHourly', 'avg', 'hourly'],
    ['Hourly', 'raw', 'hourly'],
    ['Max', 'max', 'daily'], ['Min', 'min', 'daily'], ['Avg', 'avg', 'daily']
  ];
  for (const [suf, kind, gran] of suffixMap) {
    if (key.length > suf.length && key.endsWith(suf)) {
      return { base: key.slice(0, -suf.length), kind, gran };
    }
  }
  return { base: key, kind: 'raw', gran: 'daily' };
}
function prettifyBase(base) {
  const spaced = base.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/_/g, '.');
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}

function buildSeriesIndex(rawSeriesObjects) {



  const index = {};
  rawSeriesObjects.forEach(seriesObj => {
    Object.keys(seriesObj).forEach(key => {
      const pts = seriesObj[key];
      if (!Array.isArray(pts) || !pts.length) return;
      const { base, kind, gran } = parseSeriesKey(key);
      const baseLower = base.toLowerCase();
      if (!index[baseLower]) {
        index[baseLower] = { displayBase: base, hourly: {}, daily: {} };
      }
      const bucket = index[baseLower][gran];
      bucket[kind] = (bucket[kind] || []).concat(pts);
    });
  });
  return index;
}

function mean(nums) { return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null; }
function reduceExtreme(pts, cmp) {
  if (!pts.length) return null;
  let best = pts[0];
  for (const p of pts) if (cmp(p[1], best[1])) best = p;
  return { value: best[1], ts: best[0] };
}
const reduceMax = pts => reduceExtreme(pts, (a, b) => a > b);
const reduceMin = pts => reduceExtreme(pts, (a, b) => a < b);

// MONTHS_FULL reuses the same full month-name keys already defined for
// climate.html (January, February, ... -- normal-case, suits inline use
// here directly). MONTHS_SHORT is a NEW, separate mixed-case set
// (Jan, Feb, ...) rather than reusing climate.html's own short-month
// keys, which are ALL-CAPS (JAN, FEB, ...) for that page's NOAA-report
// style -- shouting "6 JAN" inline in a sentence here would look wrong.
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDayShort(d) {
  return d.getUTCDate() + ' ' + DivumWXI18N.t(MONTHS_SHORT[d.getUTCMonth()]);
}
// Converts a real epoch timestamp into the same "fake UTC" representation
// stationNow() uses, so every date/time this page displays -- whether it's
// "now" or when a specific record happened -- is consistently in the
// station's own timezone, not whichever timezone the visitor's browser
// happens to be in.
function tsToStationDate(ts){
  var p = stationParts(new Date(ts));
  return new Date(Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second));
}
// Constructs a Date object whose UTC-getter fields (getUTCFullYear,
// getUTCMonth, getUTCDate, getUTCDay, ...) represent the station's own
// wall-clock date/time, rather than the plain `new Date()` this file
// used before -- which always reports its LOCAL calendar fields in the
// *visitor's* browser timezone, not the station's. Near any day/week/
// month/year boundary, a visitor in a different timezone than the
// station was seeing records bucketed into the wrong period entirely
// (e.g. "this week" starting a day early or late) -- not just a display
// oddity, a real difference in which data points counted. Every
// function that consumes this "fake UTC" Date must keep using UTC
// getters/Date.UTC() throughout, never local ones, or the two domains
// get mixed and shift results by the browser's own offset again.
function stationParts(date){
  var parts = {};
  new Intl.DateTimeFormat('en-GB', {
    timeZone: (window.StationTime ? window.StationTime.getTZ() : undefined), hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).formatToParts(date).forEach(function(p){ parts[p.type] = p.value; });
  return parts;
}
function stationNow(){
  var p = stationParts(new Date());
  return new Date(Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second));
}

function buildPeriods(now) {
  const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
  const dow = now.getUTCDay();
  const diffToMonday = (dow === 0 ? -6 : 1 - dow);
  const weekStartDate = new Date(Date.UTC(y, m, d + diffToMonday, 0, 0, 0, 0));
  const weekStart = weekStartDate.getTime();
  const weekEndDate = new Date(weekStartDate); weekEndDate.setUTCDate(weekEndDate.getUTCDate() + 6);
  const monthStart = Date.UTC(y, m, 1, 0, 0, 0, 0);
  const monthEnd = Date.UTC(y, m + 1, 1, 0, 0, 0, 0);
  const yearStart = Date.UTC(y, 0, 1, 0, 0, 0, 0);
  const yearEnd = Date.UTC(y + 1, 0, 1, 0, 0, 0, 0);
  // fmtRange previously called toLocaleDateString('en-GB', {month:'short'})
  // directly -- the browser's own English locale formatting, completely
  // untouched by DivumWXI18N regardless of the site's selected language
  // (same bug class as elsewhere on this site). fmtDayShort above routes
  // the month name through t() instead.
  const fmtRange = (a, b) => fmtDayShort(a) + '\u2013' + fmtDayShort(b);
  return {
    day:   { start: null, end: null, label: DivumWXI18N.t('Last 24 hours') },
    week:  { start: weekStart, end: weekEndDate.getTime() + 86400000, label: DivumWXI18N.t('Week:') + ' ' + fmtRange(weekStartDate, weekEndDate) },
    month: { start: monthStart, end: monthEnd, label: DivumWXI18N.t(MONTHS_FULL[m]) + ' ' + y },
    year:  { start: yearStart, end: yearEnd, label: String(y) },
    alltime: { start: null, end: null, label: DivumWXI18N.t('All time') }
  };
}
function filterInPeriod(pts, period) {
  if (!pts) return [];
  if (period.start == null) return pts.slice();
  return pts.filter(p => p[0] >= period.start && p[0] < period.end);
}

function poolStats(pts) {
  if (!pts.length) return { max: null, min: null, avgValue: null };
  return { max: reduceMax(pts), min: reduceMin(pts), avgValue: mean(pts.map(p => p[1])) };
}

function dayRecord(entry) {
  const h = entry.hourly;
  if (h.raw && h.raw.length) return poolStats(h.raw);
  if (h.max || h.min || h.avg) {
    const maxPt = h.max && h.max.length ? reduceMax(h.max) : null;
    const minPt = h.min && h.min.length ? reduceMin(h.min) : null;
    let avgValue = h.avg && h.avg.length ? mean(h.avg.map(p => p[1])) : null;
    if (avgValue == null && maxPt && minPt) avgValue = (maxPt.value + minPt.value) / 2;
    return { max: maxPt, min: minPt, avgValue };
  }

  const d = entry.daily;
  const anyDaily = (d.max || []).concat(d.min || [], d.avg || [], d.raw || []);
  if (!anyDaily.length) return { max: null, min: null, avgValue: null };
  const latestTs = Math.max(...anyDaily.map(p => p[0]));
  const todays = (arr) => (arr || []).filter(p => p[0] === latestTs);
  const maxPt = todays(d.max).length ? reduceMax(todays(d.max)) : (todays(d.raw).length ? reduceMax(todays(d.raw)) : null);
  const minPt = todays(d.min).length ? reduceMin(todays(d.min)) : (todays(d.raw).length ? reduceMin(todays(d.raw)) : null);
  const avgPts = todays(d.avg);
  const avgValue = avgPts.length ? mean(avgPts.map(p => p[1])) : (maxPt && minPt ? (maxPt.value + minPt.value) / 2 : null);
  return { max: maxPt, min: minPt, avgValue };
}

function periodRecordFromDaily(daily, period) {
  const maxSrc = (daily.max && daily.max.length) ? daily.max : daily.raw;
  const minSrc = (daily.min && daily.min.length) ? daily.min : daily.raw;
  const maxPts = filterInPeriod(maxSrc, period);
  const minPts = filterInPeriod(minSrc, period);
  const maxPt = maxPts.length ? reduceMax(maxPts) : null;
  const minPt = minPts.length ? reduceMin(minPts) : null;
  let avgValue = null;
  if (daily.avg && daily.avg.length) {
    const avgPts = filterInPeriod(daily.avg, period);
    if (avgPts.length) avgValue = mean(avgPts.map(p => p[1]));
  } else if (daily.max && daily.max.length && daily.min && daily.min.length) {
    const mxs = filterInPeriod(daily.max, period), mns = filterInPeriod(daily.min, period);
    const n = Math.min(mxs.length, mns.length);
    if (n) { const mids = []; for (let i = 0; i < n; i++) mids.push((mxs[i][1] + mns[i][1]) / 2); avgValue = mean(mids); }
  } else if (daily.raw && daily.raw.length) {
    const rawPts = filterInPeriod(daily.raw, period);
    if (rawPts.length) avgValue = mean(rawPts.map(p => p[1]));
  }
  return { max: maxPt, min: minPt, avgValue };
}

function computeRecords(entry, periods) {
  const out = {};
  out.day = dayRecord(entry);
  ['week', 'month', 'year', 'alltime'].forEach(pk => {
    out[pk] = periodRecordFromDaily(entry.daily, periods[pk]);
  });
  return out;
}

// -- unit conversion / formatting --
function convertValue(value, family) {
  if (value == null || isNaN(value)) return { text: '—', unit: '' };
  const sys = currentSystemConfig();
  switch (family) {
    case 'temp': {
      const unit = (sys.temp || 'C');
      const v = (unit === 'F' && typeof C2F === 'function') ? C2F(value) : value;
      return { text: v.toFixed(1), unit: '°' + unit };
    }
    case 'percent': return { text: value.toFixed(0), unit: '%' };
    case 'degrees': return { text: value.toFixed(0), unit: '°' };
    case 'index0': return { text: value.toFixed(0), unit: '' };
    case 'wind': {
      const unit = sys.wind || 'mph';
      let v = value, label = 'm/s';
      if (unit === 'mph' && typeof ms2mph === 'function') { v = ms2mph(value); label = 'mph'; }
      else if (unit === 'kmh' && typeof ms2kmh === 'function') { v = ms2kmh(value); label = 'km/h'; }
      else if (unit === 'kt' && typeof ms2kt === 'function') { v = ms2kt(value); label = 'kt'; }
      else if (unit === 'bf' && typeof beaufort === 'function') { return { text: String(Math.round(beaufort(value))), unit: 'Bft' }; }
      return { text: v.toFixed(1), unit: label };
    }
    case 'rainAmount':
    case 'rainRate': {
      const unit = sys.rain || 'mm';
      const perHour = family === 'rainRate' ? '/hr' : '';
      const v = (unit === 'in' && typeof mm2in === 'function') ? mm2in(value) : value;
      return { text: v.toFixed(2), unit: (unit === 'in' ? 'in' : 'mm') + perHour };
    }
    case 'flagged':
    default: {
      const abs = Math.abs(value);
      const dp = abs < 10 ? 2 : (abs < 100 ? 1 : 0);
      return { text: value.toFixed(dp), unit: '' };
    }
  }
}
function fmtDayTime(ts) {
  const d = tsToStationDate(ts);
  const pad = n => String(n).padStart(2, '0');
  return fmtDayShort(d) + ', ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
}
function fmtDateOnly(ts) {
  const d = tsToStationDate(ts);
  return fmtDayShort(d) + ' ' + d.getUTCFullYear();
}

function cellHtml(point, family, dateStyle) {
  if (!point) return '<span class="record-empty">—</span>';
  const c = convertValue(point.value, family);
  const dateText = dateStyle === 'time' ? fmtDayTime(point.ts) : fmtDateOnly(point.ts);
  return '<span class="record-value">' + c.text + (c.unit ? ' ' + c.unit : '') + '</span><span class="record-sub">' + dateText + '</span>';
}
function avgCellHtml(avgValue, family, periodLabel) {
  if (avgValue == null || isNaN(avgValue)) return '<span class="record-empty">—</span>';
  const c = convertValue(avgValue, family);
  return '<span class="record-value">' + c.text + (c.unit ? ' ' + c.unit : '') + '</span><span class="record-sub">' + periodLabel + '</span>';
}

const PERIOD_LABEL_KEYS = { day: '24hr', week: 'Week', month: 'Month', year: 'Year', alltime: 'All-time' };

function renderMetricCard(metric, records, periods) {
  const label = DivumWXI18N.t(metric.label);
  const unitFlagHtml = metric.family === 'flagged' ? '<span class="unit-flag">' + DivumWXI18N.t('unconfirmed unit') + (metric.note ? ' &middot; ' + metric.note : '') + '</span>'
    : (metric.note ? '<span class="unit-flag">' + metric.note + '</span>' : '');
  let rows = '';
  ['day', 'week', 'month', 'year', 'alltime'].forEach(pk => {
    const rec = records[pk];
    const dateStyle = pk === 'day' ? 'time' : 'date';
    rows += '<tr>' +
      '<td class="period-cell">' + (pk === 'day' ? ('24' + DivumWXI18N.t('hr')) : DivumWXI18N.t(PERIOD_LABEL_KEYS[pk])) + '</td>' +
      '<td>' + cellHtml(rec.max, metric.family, dateStyle) + '</td>' +
      '<td>' + cellHtml(rec.min, metric.family, dateStyle) + '</td>' +
      '<td>' + avgCellHtml(rec.avgValue, metric.family, periods[pk].label) + '</td>' +
      '</tr>';
  });
  return '<div class="record-card" data-label="' + label.toLowerCase() + '">' +
    '<h3>' + label + unitFlagHtml + '</h3>' +
    '<table class="records-table"><thead><tr><th>' + DivumWXI18N.t('Period') + '</th><th>' + DivumWXI18N.t('Max') + '</th><th>' + DivumWXI18N.t('Min') + '</th><th>' + DivumWXI18N.t('Avg') + '</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div>';
}

let SERIES_INDEX = null;
let lastLoadCount = null;
let lastLoadError = null;

function renderStatusAndLegend(){
  const statusEl = document.getElementById('recordsStatus');
  if (lastLoadError) {
    statusEl.textContent = DivumWXI18N.t('Could not load charts.json \u2014') + ' ' + lastLoadError;
    return;
  }
  if (lastLoadCount == null) return; // still loading -- static placeholder text stands
  statusEl.textContent = lastLoadCount + ' ' + DivumWXI18N.t('measured values loaded from charts.json.');
  document.getElementById('recordsLegend').innerHTML =
    '<p>' + DivumWXI18N.t('Week runs Monday\u2013Sunday, month and year are calendar periods. "24hr" is a rolling last 24 hours using real hour-by-hour timestamps.') + '</p>' +
    '<p>' + DivumWXI18N.t('Week/Month/Year/All-time Max and Min dates come from charts.json\u2019s daily-aggregate series, which only stores one timestamp per day (local midnight) \u2014 so the date shown is correct but no time-of-day is available for those periods.') + '</p>' +
    '<p><span class="unit-flag">' + DivumWXI18N.t('unconfirmed unit') + '</span> \u2014 ' + DivumWXI18N.t('this project\u2019s confirmed unit-system shape (units.js) only covers temperature, wind and rain; other values are shown in a best-guess unit and don\u2019t respond to the unit-system selector.') + '</p>' +
    '<p>' + DivumWXI18N.t('\u2021 wind direction min/max/avg are plain numeric extremes over 0\u2013360\u00B0, not circular-mean-aware \u2014 a reading near 359\u00B0 and one near 1\u00B0 won\u2019t average to "north" here.') + '</p>';
}
function renderAll() {
  if (!SERIES_INDEX) return;
  const now = stationNow();
  const periods = buildPeriods(now);
  const root = document.getElementById('recordsRoot');
  root.innerHTML = '';

  const usedBases = new Set();
  const byCategory = {};
  CATEGORY_ORDER.forEach(c => byCategory[c] = []);

  METRICS.forEach(metric => {
    const entry = SERIES_INDEX[metric.base.toLowerCase()];
    if (!entry) return;
    // Mark as "used" regardless of enabled state -- otherwise a
    // recognised-but-disabled base would fall through into the
    // leftovers/"unrecognised" section below instead of being hidden.
    usedBases.add(metric.base.toLowerCase());
    if (!isBaseCardEnabled(metric.base, ENABLED_CARDS)) return;
    const records = computeRecords(entry, periods);
    byCategory[metric.category].push(renderMetricCard(metric, records, periods));
  });



  const leftovers = Object.keys(SERIES_INDEX).filter(b => !usedBases.has(b)).sort();
  if (leftovers.length) {
    if (!byCategory['Other']) byCategory['Other'] = [];
    leftovers.forEach(baseLower => {
      const entry = SERIES_INDEX[baseLower];
      const metric = { base: entry.displayBase, label: prettifyBase(entry.displayBase) + ' (' + DivumWXI18N.t('unrecognised') + ')', category: 'Other', family: 'flagged' };
      const records = computeRecords(entry, periods);
      byCategory['Other'].push(renderMetricCard(metric, records, periods));
    });
  }

  CATEGORY_ORDER.forEach(cat => {
    const cards = byCategory[cat];
    if (!cards || !cards.length) return;
    const section = document.createElement('div');
    section.className = 'category-section';
    section.innerHTML = '<h2 class="category-title">' + DivumWXI18N.t(cat) + '</h2><div class="records-grid">' + cards.join('') + '</div>';
    root.appendChild(section);
  });

  applySearchFilter();
}

function applySearchFilter() {
  const q = document.getElementById('metricSearch').value.trim().toLowerCase();
  document.querySelectorAll('.record-card').forEach(card => {
    card.classList.toggle('hidden', q.length > 0 && !card.getAttribute('data-label').includes(q));
  });
  document.querySelectorAll('.category-section').forEach(section => {
    const anyVisible = section.querySelector('.record-card:not(.hidden)');
    section.classList.toggle('hidden', !anyVisible);
  });
}
document.getElementById('metricSearch').addEventListener('input', applySearchFilter);

function loadRecords() {
  fetch('./jsondata/charts.json?_=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(data => {
      const items = Array.isArray(data) ? data : [data];
      const seriesObjects = items.map(it => (it && it.chartPlot && it.chartPlot.series) || {}).filter(s => Object.keys(s).length);
      if (!seriesObjects.length) throw new Error('no chartPlot.series found in charts.json');
      SERIES_INDEX = buildSeriesIndex(seriesObjects);
      lastLoadCount = Object.keys(SERIES_INDEX).length;
      lastLoadError = null;
      renderStatusAndLegend();
      renderAll();
    })
    .catch(e => {
      lastLoadError = e.message;
      renderStatusAndLegend();
      console.warn('records: charts.json load failed —', e.message);
    });
}
loadRecords();
window.addEventListener('unitsystemchange', renderAll);
window.addEventListener('i18nready', function(){
  renderStatusAndLegend();
  renderAll();
});
window.addEventListener('stationtimeready', renderAll);
</script>
