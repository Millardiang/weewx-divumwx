# Builds the DivumWX update package (only the files changed since the
# previous release, installable with `weectl extension install`) and
# attaches it to the GitHub release. See tools/build_update.py and
# "Update packages" in install.py.
#
# Runs when a release is published. It can also be run by hand from the
# Actions tab, e.g. to rebuild an asset or build a package that skips a
# release (from ver.2.1.3 straight to ver.2.2.1).
name: Update package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      to:
        description: "Release tag to build the update for (e.g. ver.2.2.0)"
        required: true
      from:
        description: "Release tag to update from (blank: the previous release tag)"
        required: false
      installer_unchanged:
        description: "install.py changed, but not weewx.conf settings (no full-install note)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag, to find the previous release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the release's version labels
        if: github.event_name == 'release'
        run: python3 tools/check_version.py

      - name: Build the update package
        id: build
        env:
          TO: ${{ github.event.release.tag_name || inputs.to }}
          FROM: ${{ inputs.from }}
          INSTALLER_UNCHANGED: ${{ inputs.installer_unchanged }}
        run: |
          args=(--to "$TO" --out dist)
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ "$INSTALLER_UNCHANGED" = "true" ] && args+=(--installer-unchanged)
          python3 tools/build_update.py "${args[@]}" | tee build.log
          echo "zip=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"
          echo "tag=$TO" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.build.outputs.tag }}" "${{ steps.build.outputs.zip }}" --clobber
