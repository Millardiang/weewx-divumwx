    '‡ wind direction min/max/avg are plain numeric extremes over 0–360°, not circular-mean-aware — a reading near 359° and one near 1° won’t average to "north" here.' = '‡ min/maks/gennemsnit for vindretning er simple numeriske ekstremer over 0–360°, uden hensyn til cirkulært gennemsnit — en aflæsning tæt på 359° og en tæt på 1° vil ikke give et gennemsnit på "nord" her.'
    measured values loaded from charts.json. = målte værdier indlæst fra charts.json.
    "this project’s confirmed unit-system shape (units.js) only covers temperature, wind and rain; other values are shown in a best-guess unit and don’t respond to the unit-system selector." = "dette projekts bekræftede enhedssystem (units.js) dækker kun temperatur, vind og regn; andre værdier vises i en gætteenhed og reagerer ikke på enhedssystemvælgeren."
