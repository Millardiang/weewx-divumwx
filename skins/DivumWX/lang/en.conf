###############################################################################
# DivumWX localization file -- English (reference dictionary)
#
# This is the source-of-truth phrase list: every other lang/<code>.conf in
# this directory should carry the same set of [Texts] keys, translated. A
# language file that's missing a key isn't an error -- WeeWX falls back to
# the untranslated (English) phrase for that one key only, same as any other
# entry missing from [Texts]. See:
#   https://weewx.com/docs/latest/custom/localization/
#
# Deliberately does NOT repeat [Units][[Labels]], [Units][[Ordinates]], or
# [Labels][[Generic]] here. Those sections exist in stock WeeWX skins'
# lang files because they override that skin's own skin.conf -- but
# DivumWX has no skin.conf; the equivalent values are written directly and
# unconditionally into weewx.conf's own
# [StdReport][[DivumWXReport]][[[Defaults]]] block by install.py (see
# DIVUMWX_REPORT_UNITS_GROUPS / DIVUMWX_REPORT_LABELS /
# DIVUMWX_REPORT_GENERIC_LABELS there), and neither of DivumWX's two
# templates (archive.json.tmpl, charts.json.tmpl) currently reads
# $obs.label.* or $unit.label.<generic> at all. Adding those sections here
# would look like it does something and silently not -- exactly the
# paired-file trap flagged in the DivumWX beta-fix handover. If a future
# template starts using $obs.label/$unit.label, add those sections then,
# to both this file and install.py's Defaults block, together.
###############################################################################

[Texts]

    Language = "English"

    # Barometer pressure-trend descriptions -- see archive.json.tmpl's
    # "barom"."trend_desc" field. Consumed verbatim by the front-end
    # (cardBarometer.js inside cardsBundleNew.js), which has no
    # translation logic of its own -- whatever string is generated here
    # is what gets displayed, in whatever language this report's `lang`
    # setting selects.
    "Rising Very Rapidly"  = "Rising Very Rapidly"
    "Rising Quickly"       = "Rising Quickly"
    "Rising"                = "Rising"
    "Rising Slowly"        = "Rising Slowly"
    "Falling Very Rapidly" = "Falling Very Rapidly"
    "Falling Quickly"      = "Falling Quickly"
    "Falling"               = "Falling"
    "Falling Slowly"       = "Falling Slowly"
    "Steady"                = "Steady"

