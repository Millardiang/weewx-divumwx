    Period = الفترة
    'Week runs Monday–Sunday, month and year are calendar periods. "Day" is a rolling last 24 hours using real hour-by-hour timestamps.' = يمتد الأسبوع من الاثنين إلى الأحد، والشهر والسنة فترات تقويمية. "اليوم" هو آخر 24 ساعة متجددة باستخدام طوابع زمنية فعلية بالساعة.
    "Week/Month/Year/All-time Max and Min dates come from charts.json’s daily-aggregate series, which only stores one timestamp per day (local midnight) — so the date shown is correct but no time-of-day is available for those periods." = تأتي تواريخ الحد الأقصى والأدنى للأسبوع/الشهر/السنة/كل الأوقات من سلسلة التجميع اليومي في charts.json، والتي تخزن طابعاً زمنياً واحداً فقط لكل يوم (منتصف الليل المحلي) — لذا التاريخ المعروض صحيح ولكن لا يتوفر وقت اليوم لهذه الفترات.
    Week: = الأسبوع:
    '‡ wind direction min/max/avg are plain numeric extremes over 0–360°, not circular-mean-aware — a reading near 359° and one near 1° won’t average to "north" here.' = ‡ الحد الأدنى/الأقصى/المتوسط لاتجاه الرياح هي قيم عددية قصوى بسيطة ضمن 0–360°، وليست مدركة للمتوسط الدائري — لن تُحسب قراءة قريبة من 359° وأخرى قريبة من 1° كمتوسط "شمال" هنا.
    measured values loaded from charts.json. = قيمة مقاسة تم تحميلها من charts.json.
    "this project’s confirmed unit-system shape (units.js) only covers temperature, wind and rain; other values are shown in a best-guess unit and don’t respond to the unit-system selector." = يغطي نظام الوحدات المؤكد لهذا المشروع (units.js) درجة الحرارة والرياح والمطر فقط؛ تُعرض القيم الأخرى بوحدة تقديرية ولا تستجيب لمحدد نظام الوحدات.
