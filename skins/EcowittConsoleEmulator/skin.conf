###############################################################################
#  EcowittConsoleEmulator skin for WeeWX 5 (weewx-ecowitt_console_emulator)  #
#  A full-screen console emulator in the style of the Ecowitt WH2560/HP2560   #
#  console, for any Ecowitt gateway or console. Uses the optional             #
#  weewx-EcowittGateway driver/service's extras when it is installed.          #
#  Copyright (c) Ian Millard 2026                                             #
###############################################################################

SKIN_NAME = EcowittConsoleEmulator
SKIN_VERSION = 1.0.0

[Extras]
    # Name shown at the top of the dashboard. Leave empty to use the station name
    # (location in the [Station] section of weewx.conf).
    title = ""

    # Starting theme: navy (console look), black (OLED / night) or light.
    # The theme button on the tablet cycles through them and remembers the choice.
    theme = navy

    # Display units, the same presets as weewx-divumwx (Beaufort is shown as its
    # own reading after Max Daily Gust rather than as a unit choice):
    #   uk       °C, mph,  hPa,  mm, km
    #   us       °F, mph,  inHg, in, mi
    #   metric   °C, km/h, hPa,  mm, km
    #   scandi   °C, m/s,  hPa,  mm, km
    #   canada   °C, km/h, kPa,  mm, km
    #   icao     °C, kt,   hPa,  mm, NM
    # This is only the default: a choice made on the tablet (Settings) is kept in
    # the browser under the same key DivumWX uses ('dashboardUnitSystem'), so the
    # two sites share it when served from the same web server.
    unit_system = uk

    # Times (clock, sunrise/sunset, moon, charts) are shown in the station's time
    # zone, read from the WeeWX machine. Set a zone here only if that's wrong,
    # e.g. timezone = Europe/Paris.
    # timezone =

    # 24-hour clock (true) or 12-hour (false)
    clock_24h = true

    # Language of everything on the dashboard, including day and month names. The same
    # languages and codes as weewx-divumwx:
    #   ar Arabic, br Breton, ca Catalan, cn Chinese (simplified), cy Welsh, cz Czech,
    #   da Danish, de German, en English, en_US English (US), es Spanish, eu Basque,
    #   fi Finnish, fr French, gr Greek, hi Hindi, hu Hungarian, is Icelandic, it Italian,
    #   ja Japanese, nl Dutch, no Norwegian, pl Polish, pt Portuguese, sv Swedish,
    #   ta Tamil, th Thai, tr Turkish, uk Ukrainian, ur Urdu
    # This is only the default: a choice made on the tablet (Settings) is kept in the
    # browser under the same key DivumWX uses ('dashboardLanguage'), so the two sites
    # share it when served from the same web server.
    language = en

    # Rain sensor(s). The installer asks (with weewx-EcowittGateway, defaulting to its rain_source)
    # and writes the answer to weewx.conf ([StdReport][[EcowittConsoleEmulatorReport]]
    # [[[Extras]]] rain_sensors), which wins over this file. When neither is
    # set, weewx-EcowittGateway's rain_source is used if it is installed, else auto.
    #   tipping  tipping-bucket gauge (WH40, WS69, WN20)
    #   piezo    piezo haptic gauge (WS90, WS85)
    #   both     both: the rain section shows a Tipping and a Piezo column
    #   auto     show whichever reports data
    # rain_sensors = auto

    # Barometer shown first: REL or ABS (tap the reading to switch)
    baro_mode = REL

    # Live data. The installer sets this in weewx.conf: live.json, written by the
    # skin's own EcowittConsoleEmulatorLive service, or, if weewx-EcowittGateway is
    # installed and you choose it, that driver's ecwLoop.json (e.g. ../ecwLoop.json). Any units are fine: the
    # browser converts them. Polled every live_poll seconds; treated as stale
    # after live_stale seconds.
    live_url = live.json
    live_poll = 5
    # The archive summary (ecowitt.json) is re-read every archive_poll seconds
    archive_poll = 60
    live_stale = 120

    # "Radar" button at the top left: opens Windy's radar centred on the
    # station's latitude/longitude ([Station] in weewx.conf). windy_zoom: 3-11.
    windy_radar = true
    windy_zoom = 8
    # windy_url = https://www.windy.com/?radar,{lat},{lon},{zoom},d:picker
    # panel: the radar map opens in a panel over the dashboard (Windy embed; its
    # wind/temperature units follow the dashboard's unit preset). link: opens windy.com.
    windy_mode = panel

    # Small link chips at the top left (label = url). Remove or add as you like.
    [[Links]]
        # Ecowitt = https://www.ecowitt.net/home/index?id=YOUR_ID
        # Windy = https://www.windy.com/station/YOUR_ID
        # WeatherCloud = https://app.weathercloud.net/YOUR_ID

    # ---------------------------------------------------------------------
    # Field names. The defaults are the standard WeeWX names plus those of
    # weewx-EcowittGateway. Uncomment and change any your driver names differently.
    # ---------------------------------------------------------------------
    [[FieldMap]]
        # feelslike = feelslike
        # windDir10 = windDir10
        # maxdailygust = maxdailygust
        # lightning_dist = lightning_dist
        # lightning_time = lightning_disturber_count   # last strike time
        # lightningcount = lightningcount               # strikes today
        # eventRain = eventRain
        # hourRain = hourRain
        # p_rainrate = p_rainrate
        # drain_piezo = drain_piezo

    # Temperature/humidity channels for the second gauge pair. The CH button
    # cycles through every channel that has data.
    #   label = temp field, humidity field, sensor id (for signal/battery)
    # Empty = Indoor (inTemp/inHumidity, wh25) + WN31 CH1-8 (extraTempN/extraHumidN, wn31_chN).
    [[Channels]]
        # Indoor = inTemp, inHumidity, wh25
        # Greenhouse = extraTemp1, extraHumid1, wn31_ch1
        # Freezer = extraTemp2, None, wn31_ch2

    # Optional overrides (label = field, sensor id). Empty = the default names:
    #   SoilChannels: WH51 CH1-16 = soilMoist1-16, wh51_ch1-16
    #   LeafChannels: WN35 CH1-8  = leafWet1-8,   wn35_ch1-8
    #   LeakChannels: 1-4         = leak_1-4,     wh55_ch1-4
    #   PMChannels:   CH1-4 = pm25_1-4 (WH41/43, wh41_chN), WH45 = pm2_5 (wh45)
    [[SoilChannels]]
    [[LeafChannels]]
    [[LeakChannels]]
    [[PMChannels]]

    # Sensor battery / signal list (Sensors button). Empty = every sensor under
    # weewx-EcowittGateway's field names; only those with data are shown. With
    # another driver, list its battery/signal fields here.
    #   label = battery field, signal field, kind, sensor id
    #   kind: binary (0 = OK) | level (0-5, 6 = DC) | volt:<low volts>
    [[Sensors]]
        # WS90 array = ws90_batt, ws90_sig, volt:2.4, ws90
        # WH40 rain gauge = wh40_batt, wh40_sig, level, wh40
        # WH51 CH1 = soilMoistBatt1, wh51_ch1_sig, volt:1.2, wh51_ch1

###############################################################################

[Units]
    # As in weewx-divumwx, ecowitt.json and live.json are always written in
    # METRICWX (°C, m/s, mm, hPa, km) and the browser converts them to the display
    # units chosen above. weewx.conf unit settings do not affect the dashboard.
    # They do still decide the units of the images on the Graphs page.

    [[StringFormats]]
        degree_C  = %.1f
        degree_F  = %.1f
        hPa       = %.1f
        inHg      = %.2f
        mm        = %.1f
        inch      = %.2f
        km_per_hour = %.1f
        mile_per_hour = %.1f

    [[Labels]]
        degree_C  = °
        degree_F  = °
        hPa       = hPa
        inHg      = inHg
        mbar      = mbar
        mm        = mm
        cm        = cm
        inch      = in
        mm_per_hour = mm/h
        inch_per_hour = in/h
        km_per_hour = km/h
        mile_per_hour = mph
        meter_per_second = m/s
        knot      = kn
        km        = km
        mile      = mi
        watt_per_meter_squared = W/m²
        microgram_per_meter_cubed = µg/m³
        ppm       = ppm

    [[TimeFormats]]
        current = %H:%M

###############################################################################

[CheetahGenerator]
    encoding = html_entities
    search_list_extensions = user.ecowitt_console_emulator.EcowittConsoleEmulatorData

    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        [[[summary]]]
            template = ecowitt.json.tmpl
            encoding = utf8
        # Chart data for the Charts panel. Month and year change slowly, so they are
        # rebuilt at most once an hour.
        [[[chart_day]]]
            template = chart_day.json.tmpl
            encoding = utf8
        [[[chart_week]]]
            template = chart_week.json.tmpl
            encoding = utf8
            stale_age = 1800
        [[[chart_month]]]
            template = chart_month.json.tmpl
            encoding = utf8
            stale_age = 3600
        [[[chart_year]]]
            template = chart_year.json.tmpl
            encoding = utf8
            stale_age = 3600

###############################################################################

[CopyGenerator]
    copy_always = css/*.css, js/*.js, icons/*.svg, lang/*.json, manifest.json

###############################################################################

# Charts are drawn in the browser (themed, in the display units), so this skin
# no longer uses WeeWX's ImageGenerator.

###############################################################################

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
